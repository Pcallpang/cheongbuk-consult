<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<title>진로진학 상담 · 청북고 3-9</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css');

*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Pretendard','Malgun Gothic',sans-serif;background:var(--c-bg);color:var(--c-gray-900);font-size:14px;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;letter-spacing:-0.01em}

/* ── 타이포그래피 시스템 ── */
.t-display{font-size:24px;font-weight:800;letter-spacing:-0.5px;line-height:1.2}
.t-heading{font-size:16px;font-weight:700;letter-spacing:-0.3px;line-height:1.4}
.t-subheading{font-size:14px;font-weight:600;letter-spacing:-0.2px}
.t-body{font-size:14px;font-weight:400;line-height:1.7}
.t-label{font-size:11px;font-weight:600;letter-spacing:0.05em;color:#64748b;text-transform:uppercase}
.t-data{font-size:13px;font-weight:500;font-variant-numeric:tabular-nums}
.t-caption{font-size:11px;font-weight:400;color:#94a3b8}
.t-mono{font-family:'Pretendard',monospace;font-variant-numeric:tabular-nums}
.hidden{display:none!important}
.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 14px;border:none;border-radius:7px;cursor:pointer;font-size:13px;font-family:'Pretendard',inherit;font-weight:700;transition:all .15s;white-space:nowrap;letter-spacing:-0.1px}
.btn-primary{background:var(--c-primary-600);color:#fff;box-shadow:0 1px 3px rgba(91,78,240,.3)}.btn-primary:hover{background:var(--c-primary-700);box-shadow:0 3px 10px rgba(91,78,240,.35);transform:translateY(-1px)}
.btn-secondary{background:var(--c-gray-100);color:var(--c-gray-700);border:1px solid var(--c-border)}.btn-secondary:hover{background:var(--c-gray-200);transform:translateY(-1px)}
.btn-danger{background:var(--c-danger-50);color:var(--c-danger-700);border:1px solid var(--c-danger-100)}.btn-danger:hover{background:var(--c-danger-100);transform:translateY(-1px)}
.btn-warn{background:var(--c-warning-50);color:var(--c-warning-700);border:1px solid var(--c-warning-100)}.btn-warn:hover{background:var(--c-warning-100);transform:translateY(-1px)}
.btn-sm{padding:4px 10px;font-size:12px}
.badge{display:inline-block;padding:2px 9px;border-radius:12px;font-size:11px;font-weight:700}
.dir-상향{background:var(--c-warning-50);color:var(--c-warning-700);font-weight:700}.dir-소신{background:#eff6ff;color:#1d4ed8;font-weight:700}
.dir-적정{background:var(--c-success-50);color:var(--c-success-700);font-weight:700}.dir-하향{background:var(--c-danger-50);color:var(--c-danger-700);font-weight:700}
.adm-종합{background:var(--c-primary-100);color:var(--c-primary-700);font-weight:700}.adm-교과{background:var(--c-success-100);color:var(--c-success-700);font-weight:700}
.adm-논술{background:#fff7ed;color:#c2410c;font-weight:700}
input,textarea,select{font-family:'Pretendard',inherit;font-size:13px;font-weight:400}
input[type=text],input[type=password],input[type=tel],input[type=date],textarea,select{border:1px solid #d1d5db;border-radius:7px;padding:7px 10px;width:100%;outline:none;background:#fff;transition:border .15s}
input:focus,textarea:focus,select:focus{border-color:var(--c-primary-500);box-shadow:0 0 0 3px rgba(109,95,250,.1);outline:none}
textarea{resize:vertical;line-height:1.6}
.form-label{font-size:11px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:0.06em;display:block;margin-bottom:5px}
.form-group{margin-bottom:12px}
.card{background:var(--c-surface);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);border:1px solid var(--c-border);overflow:hidden}
.card-body{padding:20px 22px}
.sec-title{font-size:12px;font-weight:700;color:#475569;margin-bottom:12px;display:flex;align-items:center;gap:7px;letter-spacing:0.04em;text-transform:uppercase}
.sec-title::before{content:'';display:inline-block;width:3px;height:13px;background:var(--c-primary-500);border-radius:2px}
.divider{height:1px;background:#f0f0f0;margin:14px 0}
.toast{position:fixed;bottom:24px;right:24px;background:var(--c-gray-900);color:#f1f5f9;padding:12px 18px;border-radius:var(--radius-md);font-size:13px;font-weight:500;z-index:9999;opacity:0;transition:opacity .3s;pointer-events:none;box-shadow:var(--shadow-lg)}
.toast.show{opacity:1}
.saving-indicator{position:fixed;top:14px;right:20px;background:var(--c-success-500);color:#fff;padding:6px 16px;border-radius:20px;font-size:12px;font-weight:600;z-index:8000;opacity:0;transition:opacity .3s;pointer-events:none;box-shadow:0 2px 8px rgba(16,185,129,.3)}
.saving-indicator.show{opacity:1}
/* 로딩 */
#loadingScreen{position:fixed;inset:0;background:#f0f2f7;z-index:9000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
.spinner{width:40px;height:40px;border:4px solid #e0e7ff;border-top-color:#4f46e5;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* Layout */
.app{display:flex;height:100vh;overflow:hidden}
.sidebar{width:242px;background:#0f172a;color:#e2e8f0;display:flex;flex-direction:column;flex-shrink:0;box-shadow:4px 0 24px rgba(0,0,0,.18)}
.sidebar-hd{padding:18px 16px 14px;border-bottom:1px solid rgba(255,255,255,.06)}
.sidebar-hd h1{font-size:13px;font-weight:800;color:#f1f5f9;letter-spacing:-0.2px}
.sidebar-hd p{font-size:11px;font-weight:500;color:#64748b;margin-top:2px;letter-spacing:0.01em}
.sb-search{padding:10px 12px}
.sb-search input{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);color:#e2e8f0;font-size:12px;border-radius:8px}
.sb-search input::placeholder{color:#475569}
.sb-nav{padding:8px 12px;border-bottom:1px solid rgba(255,255,255,.06);display:flex;gap:3px;flex-wrap:wrap}
.nb{flex:1;padding:5px 4px;border:none;background:transparent;color:#64748b;cursor:pointer;border-radius:8px;font-size:11px;font-family:'Pretendard',inherit;font-weight:700;transition:all .2s;min-width:36px;letter-spacing:-0.1px}
.nb.active{background:rgba(109,95,250,.25);color:#a5b4fc;box-shadow:inset 0 0 0 1px rgba(109,95,250,.3)}
.s-list{flex:1;overflow-y:auto}
.s-list::-webkit-scrollbar{width:3px}
.s-list::-webkit-scrollbar-thumb{background:#3d3d5e;border-radius:2px}
.s-item{margin:2px 8px;padding:10px 12px;cursor:pointer;display:flex;align-items:center;gap:8px;border-left:none;border-radius:10px;transition:all .2s cubic-bezier(.4,0,.2,1)}
.s-item:hover{background:rgba(255,255,255,.05)}.s-item.active{background:linear-gradient(135deg,rgba(109,95,250,.22),rgba(124,58,237,.14));box-shadow:inset 0 0 0 1px rgba(109,95,250,.25)}
.s-item .sno{font-size:10px;font-weight:600;color:#475569;width:24px;flex-shrink:0}
.s-item .snm{font-size:13px;font-weight:700;color:#cbd5e1;flex:1;letter-spacing:-0.1px}.s-item.active .snm{color:#a5b4fc}
.s-item .stg{font-size:10px;font-weight:600;background:rgba(109,95,250,.15);color:#818cf8;padding:2px 7px;border-radius:9px;max-width:68px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.s-item .gm{color:#60a5fa;font-size:10px}.s-item .gf{color:#f9a8d4;font-size:10px}
.sb-foot{padding:12px;border-top:1px solid rgba(255,255,255,.06)}
.sb-foot button{width:100%;padding:8px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.03);color:#64748b;border-radius:9px;cursor:pointer;font-size:12px;font-family:'Pretendard',inherit;font-weight:600;transition:all .2s}
.sb-foot button:hover{background:rgba(255,255,255,.07);color:#94a3b8}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;background:var(--c-bg)}
.topbar{background:rgba(255,255,255,.88);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:12px 22px;border-bottom:1px solid rgba(226,232,240,.8);display:flex;align-items:center;gap:10px;flex-shrink:0;box-shadow:0 1px 0 rgba(15,23,42,.04);flex-wrap:wrap}
.topbar h2{font-size:17px;font-weight:800;color:#0f172a;letter-spacing:-0.4px}
.content{flex:1;overflow-y:auto;padding:20px 24px}
.tab-bar{display:flex;background:var(--c-gray-100);border-radius:var(--radius-md);padding:3px;overflow-x:auto;border:1px solid var(--c-border)}
.tab-btn{padding:6px 14px;border:none;background:transparent;cursor:pointer;border-radius:7px;font-size:12px;color:#64748b;font-family:inherit;font-weight:600;transition:all .15s;white-space:nowrap;letter-spacing:-0.1px}
.tab-btn.active{background:var(--c-surface);color:var(--c-gray-900);box-shadow:0 1px 4px rgba(15,23,42,.1),0 0 0 1px rgba(15,23,42,.04);font-weight:800;letter-spacing:-0.2px}
/* Landing/Login */
#landingPage,#loginPage,#studentLoginPage{min-height:100dvh;min-height:-webkit-fill-available;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--c-bg);padding:20px 16px;overflow-y:auto}
.lc{background:#fff;border-radius:16px;padding:32px 28px;width:100%;max-width:400px;box-shadow:0 4px 24px rgba(0,0,0,.1)}
.lc h2{font-size:22px;font-weight:800;color:#0f172a;margin-bottom:6px;letter-spacing:-0.5px}
.lc p{font-size:13px;font-weight:400;color:#64748b;margin-bottom:20px}
.role-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.role-card{border:1.5px solid var(--c-border);border-radius:var(--radius-lg);padding:20px 14px;cursor:pointer;text-align:center;transition:all .2s cubic-bezier(.4,0,.2,1);box-shadow:var(--shadow-xs)}
.role-card:hover{border-color:var(--c-primary-500);background:var(--c-primary-50);box-shadow:var(--shadow-md);transform:translateY(-2px)}
.role-card .ri{font-size:30px;margin-bottom:7px}
.role-card h3{font-size:13px;font-weight:800;color:#0f172a;letter-spacing:-0.2px}
.role-card p{font-size:11px;font-weight:500;color:#94a3b8;margin-top:3px;margin-bottom:0}
.err-msg{background:var(--c-danger-50);color:var(--c-danger-700);border:1px solid var(--c-danger-100);padding:10px 14px;border-radius:var(--radius-sm);font-size:13px;font-weight:500;margin-bottom:12px;display:none}
/* Overview */
.ov-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}
.stat-card{background:var(--c-surface);border-radius:var(--radius-lg);padding:18px 20px;border:1px solid var(--c-border);box-shadow:var(--shadow-sm);transition:box-shadow .2s,transform .2s}
.stat-card .sn{font-size:28px;font-weight:800;color:var(--c-primary-600);letter-spacing:-1px;font-variant-numeric:tabular-nums}
.stat-card .sl{font-size:11px;font-weight:500;color:#94a3b8;margin-top:4px;letter-spacing:0.02em}
.roster-table{width:100%;border-collapse:collapse;font-size:13px}
.roster-table th{background:var(--c-gray-50);color:var(--c-gray-500);font-weight:600;font-size:11px;padding:11px 13px;text-align:left;border-bottom:2px solid var(--c-border);white-space:nowrap;letter-spacing:0.04em;text-transform:uppercase}
.roster-table td{padding:11px 13px;border-bottom:1px solid var(--c-gray-100);vertical-align:middle;font-size:13px;font-weight:400;color:var(--c-gray-700)}
.roster-table tr:hover td{background:#fafbff}
.link-code{font-family:'Pretendard',monospace;background:var(--c-gray-100);color:var(--c-primary-600);padding:3px 8px;border-radius:6px;font-size:12px;font-weight:600;border:1px solid var(--c-border)}
/* Detail */
.dh{background:var(--c-surface);border-radius:var(--radius-lg);padding:20px 22px;margin-bottom:16px;display:flex;align-items:flex-start;gap:14px;box-shadow:var(--shadow-sm);border:1px solid var(--c-border);flex-wrap:wrap}
.dh-info{flex:1;min-width:200px}
.dh-name{font-size:22px;font-weight:800;letter-spacing:-0.5px;color:#0f172a}
.dh-meta{display:flex;gap:7px;margin-top:6px;flex-wrap:wrap;align-items:center}
.dh-num{font-size:11px;font-weight:600;color:#64748b;background:#f1f5f9;padding:3px 10px;border-radius:11px;letter-spacing:0.01em}
.dh-badge{font-size:11px;font-weight:700;padding:3px 10px;border-radius:11px;letter-spacing:-0.1px}
.dh-actions{display:flex;gap:7px;align-items:flex-start;flex-shrink:0}
.contact-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.contact-item label{font-size:11px;font-weight:700;color:#6b7280;display:block;margin-bottom:3px}
.contact-item .cv{font-size:13px;color:#1f2937;font-weight:500}
/* School table */
.school-tbl{width:100%;border-collapse:collapse;font-size:12px}
.school-tbl thead th{background:#f8f9fa;color:#374151;font-weight:700;padding:8px 9px;text-align:center;border:1px solid #e5e7eb;white-space:nowrap}
.school-tbl thead th:first-child,.school-tbl thead th:nth-child(2){text-align:left;padding-left:14px}
.school-tbl tbody td{padding:11px 12px;border:none;border-bottom:1px solid var(--c-gray-100);vertical-align:middle;text-align:center;font-size:12px;color:var(--c-gray-700)}
.school-tbl tbody td:first-child,.school-tbl tbody td:nth-child(2){text-align:left;padding-left:14px}
.school-tbl tbody tr:hover td{background:#fafbff}
td.school-name-cell{font-weight:700;color:#1f2937}
td.dept-cell{color:#4b5563;font-size:12px}
.note-chip{display:block;font-size:10px;color:#f59e0b;margin-top:2px}
.score-diff{font-size:10px;display:block;margin-top:1px}
.score-diff.over{color:#dc2626}.score-diff.under{color:#059669}
/* 신호등 */
.traffic-light{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:2px 7px;border-radius:10px}
.tl-green{background:var(--c-success-50);color:var(--c-success-700);border:1px solid #a7f3d0}.tl-yellow{background:var(--c-warning-50);color:var(--c-warning-700);border:1px solid #fde68a}.tl-red{background:var(--c-danger-50);color:var(--c-danger-700);border:1px solid #fecdd3}.tl-gray{background:var(--c-gray-100);color:var(--c-gray-500);border:1px solid var(--c-gray-200)}
/* 상담기록 */
.counsel-entry{background:var(--c-gray-50);border:1px solid var(--c-border);border-radius:var(--radius-md);padding:16px;margin-bottom:10px;position:relative;transition:box-shadow .2s}
.counsel-entry-hd{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.counsel-date-badge{background:var(--c-primary-600);color:#fff;padding:3px 11px;border-radius:10px;font-size:11px;font-weight:700;letter-spacing:0.02em}
.counsel-round{font-size:11px;color:#6b7280;font-weight:600}
.counsel-del{position:absolute;top:10px;right:10px;border:none;background:none;color:#d1d5db;cursor:pointer;font-size:14px;padding:2px 6px;border-radius:4px}
.counsel-del:hover{background:#fee2e2;color:#dc2626}
.counsel-body{font-size:13px;font-weight:400;line-height:1.8;color:#334155;white-space:pre-wrap}
/* 분석 */
.a-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.a-item.full{grid-column:1/-1}

/* 모달 */
.modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.5);backdrop-filter:blur(4px);z-index:1000;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--c-surface);border-radius:var(--radius-xl);width:100%;max-width:600px;max-height:92vh;overflow-y:auto;box-shadow:0 20px 60px rgba(15,23,42,.2),0 4px 16px rgba(15,23,42,.1)}
.modal-hd{padding:16px 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #f0f0f0;position:sticky;top:0;background:#fff;z-index:1}
.modal-hd h3{font-size:15px;font-weight:800;letter-spacing:-0.3px;color:#0f172a}
.modal-close{border:none;background:none;font-size:18px;cursor:pointer;color:#6b7280;padding:3px 7px;border-radius:6px}
.modal-close:hover{background:#f3f4f6}
.modal-body{padding:16px 20px 20px}
/* 확인 */
.cf-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:2000;display:flex;align-items:center;justify-content:center}
.cf-box{background:#fff;border-radius:12px;padding:22px;max-width:320px;width:90%;box-shadow:0 8px 32px rgba(0,0,0,.2);text-align:center}
.cf-box h3{font-size:15px;font-weight:700;margin-bottom:7px}
.cf-box p{font-size:13px;color:#6b7280;margin-bottom:18px}
.cf-box .br{display:flex;gap:10px;justify-content:center}
/* 학생앱 */
.stu-app{min-height:100vh;background:#f0f2f7;display:flex;flex-direction:column}
.stu-topbar{background:var(--c-gray-900);color:#f1f5f9;padding:13px 22px;display:flex;align-items:center;gap:10px;box-shadow:0 2px 8px rgba(15,23,42,.2)}
.stu-topbar h1{font-size:14px;font-weight:700}
.stu-name-badge{background:var(--c-primary-600);padding:4px 13px;border-radius:18px;font-size:12px;font-weight:700;box-shadow:0 2px 6px rgba(91,78,240,.3)}
.stu-topbar .lo{margin-left:auto;font-size:12px;color:#8888aa;cursor:pointer}
.stu-content{flex:1;padding:20px;max-width:860px;width:100%;margin:0 auto}
.copy-btn{padding:4px 9px;border:1px solid #e5e7eb;background:#f9fafb;border-radius:6px;cursor:pointer;font-size:11px;color:#6b7280;font-family:inherit}
.copy-btn:hover{background:#f3f4f6}
/* 타임라인 */
.timeline-wrap{position:relative;padding-left:28px}
.timeline-wrap::before{content:'';position:absolute;left:10px;top:0;bottom:0;width:2px;background:#e5e7eb}
.tl-item{position:relative;margin-bottom:14px}


.tl-card-hd{display:flex;align-items:center;gap:8px;margin-bottom:4px;flex-wrap:wrap}
.tl-type-badge{font-size:10px;font-weight:700;padding:2px 8px;border-radius:8px}
.type-1차발표-bg{background:#ede9fe;color:#4f46e5}.type-면접-bg{background:#fef3c7;color:#92400e}.type-발표-bg{background:#d1fae5;color:#065f46}
.tl-school{font-size:13px;font-weight:700;color:#1f2937}
.tl-past{opacity:.5}
/* 대시보드 */
.dash-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;margin-bottom:18px}


.overlap-item{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid #f3f4f6;font-size:12px}
.overlap-count{font-size:11px;font-weight:700;background:#ede9fe;color:#4f46e5;padding:2px 8px;border-radius:9px}
/* 빠른입력 */
.qi-layout{display:grid;grid-template-columns:1fr 1fr;gap:16px;min-height:300px}
.qi-textarea{min-height:200px;font-size:13px;line-height:1.8;font-family:monospace;border:1px solid #d1d5db;border-radius:8px;padding:10px 12px;width:100%;outline:none;resize:none}
.qi-textarea:focus{border-color:#4f46e5}
.qi-example{background:#f8f9ff;border:1px solid #e0e7ff;border-radius:7px;padding:10px 12px;font-size:12px;color:#4338ca;margin-bottom:10px;line-height:1.8}
.preview-tbl{width:100%;border-collapse:collapse;font-size:12px}
.preview-tbl th{background:#f8f9fa;padding:6px 8px;border:1px solid #e5e7eb;font-size:11px;font-weight:700;color:#6b7280;white-space:nowrap}
.preview-tbl td{padding:6px 8px;border:1px solid #f0f0f0}
.preview-tbl td input{border:none;background:transparent;font-size:12px;width:100%;padding:0;outline:none;min-width:50px}
.preview-tbl .row-ok{background:#f0fdf4}.preview-tbl .row-warn{background:#fffbeb}

/* ── 상담예약 캘린더 ── */
.cal-wrap{background:#fff;border-radius:12px;padding:20px;box-shadow:0 1px 4px rgba(0,0,0,.07)}
.cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.cal-header h3{font-size:18px;font-weight:800;color:#0f172a;letter-spacing:-0.5px}
.cal-nav{display:flex;gap:6px}
.cal-nav button{width:30px;height:30px;border:1px solid #e5e7eb;background:#fff;border-radius:7px;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center}
.cal-nav button:hover{background:#f3f4f6}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-dow{text-align:center;font-size:11px;font-weight:700;color:#94a3b8;padding:7px 0;letter-spacing:0.03em}
.cal-dow:first-child{color:#ef4444}.cal-dow:last-child{color:#6b7280}
.cal-day{border:1px solid #f0f0f0;border-radius:10px;padding:8px 7px;min-height:90px;background:#fff;transition:all .15s;vertical-align:top}
.cal-day:hover{border-color:#c7d2fe;background:#fafbff}
.cal-day.today{border-color:#4f46e5;background:#faf9ff}
.cal-day.other-month{background:#f9fafb;opacity:.5}
.cal-day.past{opacity:.4;pointer-events:none}
.cal-day.holiday{background:#fff5f5}
.cal-day-num{font-size:12px;font-weight:700;color:#374151;margin-bottom:5px}
.cal-day.today .cal-day-num{color:#4f46e5}
.cal-day-num.sun{color:#ef4444}.cal-day-num.sat{color:#6b7280}
.cal-day.no-consult .cal-day-num::after{content:'';display:block;font-size:10px;color:#9ca3af;font-weight:400}
.no-consult-label{font-size:10px;color:#9ca3af;margin-top:2px}
.slot-btn{display:block;width:100%;text-align:left;border:none;border-radius:6px;padding:3px 7px;font-size:10px;font-weight:700;cursor:pointer;margin-top:3px;font-family:inherit;transition:all .15s}
.slot-available{background:#f0fdf4;color:#059669}.slot-available:hover{background:#dcfce7}
.slot-full{background:#fee2e2;color:#dc2626;cursor:default;text-decoration:line-through}
.slot-mine{background:#ede9fe;color:#4f46e5}.slot-mine:hover{background:#ddd6fe}
.slot-pending{background:#fef3c7;color:#92400e}
.slot-confirmed{background:#d1fae5;color:#065f46}
.slot-teacher-set{background:#dbeafe;color:#1d4ed8}
/* 예약 목록 */
.resv-item{background:var(--c-gray-50);border:1px solid var(--c-border);border-radius:var(--radius-md);padding:14px 16px;margin-bottom:8px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;transition:box-shadow .2s}
.resv-item:hover{box-shadow:var(--shadow-sm);}
.resv-date{font-size:13px;font-weight:700;color:#1f2937;min-width:100px}
.resv-slot{font-size:12px;color:#6b7280}
.resv-name{font-size:13px;font-weight:600;color:#4f46e5;min-width:60px}
.resv-status{padding:3px 10px;border-radius:10px;font-size:11px;font-weight:700}
.status-pending{background:var(--c-warning-50);color:var(--c-warning-700);border:1px solid var(--c-warning-100)}
.status-confirmed{background:#eff6ff;color:#1d4ed8;border:1px solid #bfdbfe}
.status-teacher{background:#dbeafe;color:#1d4ed8}
/* 알림 배지 */
.notif-badge{position:relative;display:inline-flex}
.notif-dot{position:absolute;top:-4px;right:-4px;width:16px;height:16px;background:#ef4444;color:#fff;border-radius:50%;font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center;border:2px solid #fff}
.notif-panel{position:fixed;top:56px;right:16px;width:300px;background:#fff;border-radius:12px;box-shadow:0 8px 32px rgba(0,0,0,.15);z-index:5000;border:1px solid #e5e7eb;max-height:400px;overflow-y:auto}
.notif-panel-hd{padding:12px 16px;border-bottom:1px solid #f0f0f0;display:flex;align-items:center;justify-content:space-between}
.notif-panel-hd h4{font-size:13px;font-weight:700}
.notif-clear{font-size:11px;color:#6b7280;cursor:pointer;border:none;background:none;font-family:inherit}
.notif-item{padding:10px 16px;border-bottom:1px solid #f9fafb;font-size:12px;line-height:1.5}
.notif-item:last-child{border-bottom:none}
.notif-item .ni-time{font-size:10px;color:#9ca3af;margin-top:2px}
.notif-empty{padding:20px;text-align:center;color:#d1d5db;font-size:13px}
.notif-clickable:hover{background:#f0f7ff}

/* ══ 모바일/태블릿 반응형 ══ */
.hamburger{display:none;align-items:center;justify-content:center;width:36px;height:36px;border:none;background:transparent;font-size:22px;cursor:pointer;color:#374151;border-radius:7px;flex-shrink:0}
.hamburger:hover{background:#f3f4f6}
.sb-overlay{display:none;position:fixed;inset:0;background:rgba(15,23,42,.5);backdrop-filter:blur(2px);z-index:499}
.sb-overlay.show{display:block}

@media(max-width:768px){
  /* 사이드바 슬라이드 */
  .app{overflow:visible}
  .hamburger{display:flex}
  .sidebar{position:fixed;left:-250px;top:0;bottom:0;height:100dvh;z-index:500;transition:left .25s ease;overflow-y:auto}
  .sidebar.open{left:0}
  .main{width:100%}

  /* 탑바 */
  .topbar{padding:10px 12px;gap:6px;flex-wrap:nowrap}
  .topbar h2{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px}
  #topbarActions{gap:4px}
  #topbarActions .btn{padding:5px 8px;font-size:11px}

  /* 콘텐츠 */
  .content{padding:12px 14px}

  /* 통계 카드 2열 */
  .ov-grid{grid-template-columns:1fr 1fr}

  /* 학생 상세 헤더 */
  .dh{flex-direction:column;gap:8px}
  .dh-actions{flex-direction:row;flex-wrap:wrap}
  .dh-name{font-size:17px}

  /* 탭바 스크롤 */
  .tab-bar{overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;flex-wrap:nowrap}
  .tab-bar::-webkit-scrollbar{display:none}
  .tab-btn{white-space:nowrap;flex-shrink:0;font-size:11px;padding:5px 9px}

  /* 연락처 1열 */
  .contact-grid{grid-template-columns:1fr}

  /* 생기부 1열 */
  .a-grid{grid-template-columns:1fr}
  .a-item.full{grid-column:1}

  /* 희망대학 표 - 스크롤 */
  .school-tbl{font-size:11px}
  .school-tbl th,.school-tbl td{padding:5px 6px}

  /* 캘린더 */
  .cal-day{min-height:70px;padding:5px 4px}
  .cal-day-num{font-size:11px}
  .slot-btn{font-size:9px;padding:2px 4px}
  .cal-wrap{padding:12px 10px}
  .cal-header h3{font-size:15px}

  /* 모달 하단 시트 */
  .modal-overlay{align-items:flex-end;padding:0}
  .modal{border-radius:16px 16px 0 0;max-height:90dvh;max-width:100%!important;width:100%}

  /* 알림 패널 */
  .notif-panel{width:calc(100vw - 32px);right:8px;top:52px}

  /* 대시보드 1열 */
  .dash-grid{grid-template-columns:1fr}

  /* 빠른입력 1열 */
  .qi-layout{grid-template-columns:1fr}
  .qi-textarea{min-height:120px}

  /* 학생앱 */
  .stu-content{padding:12px 14px}
  .stu-topbar{padding:10px 14px;gap:6px}
  .stu-topbar h1{font-size:12px}
  .stu-name-badge{font-size:11px;padding:3px 8px}
  .resv-item{flex-wrap:wrap;gap:6px}
  .resv-date{min-width:auto}

  /* 로그인 */
  .lc{padding:24px 18px}
  .role-grid{gap:8px}
  .role-card{padding:14px 10px}
  .role-card .ri{font-size:24px}

  /* 버튼 */
  .btn{padding:7px 11px;font-size:12px}
  .btn-sm{padding:4px 9px;font-size:11px}

  /* 예비지원대학 */
  .roster-table{font-size:11px}
  .roster-table th,.roster-table td{padding:6px 7px}
}

@media(max-width:480px){
  .ov-grid{grid-template-columns:1fr}
  .topbar h2{max-width:90px}
  .cal-grid{gap:2px}
  .cal-day{min-height:60px;padding:4px 3px}
  .slot-btn{font-size:8px;padding:1px 3px}
}

@media(min-width:769px) and (max-width:1024px){
  .sidebar{width:200px}
  .cal-day{min-height:80px}
  .school-tbl{font-size:12px}
}

/* ══ 컬러 시스템 ══ */
:root {
  --c-primary-50:  #f5f3ff;
  --c-primary-100: #ede9fe;
  --c-primary-200: #ddd6fe;
  --c-primary-500: #6d5ffa;
  --c-primary-600: #5b4ef0;
  --c-primary-700: #4a3de0;

  --c-success-50:  #f0fdf6;
  --c-success-100: #dcfce7;
  --c-success-500: #10b981;
  --c-success-700: #047857;

  --c-warning-50:  #fffbeb;
  --c-warning-100: #fef3c7;
  --c-warning-500: #f59e0b;
  --c-warning-700: #b45309;

  --c-danger-50:   #fff1f2;
  --c-danger-100:  #ffe4e6;
  --c-danger-500:  #f43f5e;
  --c-danger-700:  #be123c;

  --c-gray-50:  #f8fafc;
  --c-gray-100: #f1f5f9;
  --c-gray-200: #e2e8f0;
  --c-gray-300: #cbd5e1;
  --c-gray-400: #94a3b8;
  --c-gray-500: #64748b;
  --c-gray-700: #334155;
  --c-gray-800: #1e293b;
  --c-gray-900: #0f172a;

  --c-bg:      #f0f4f8;
  --c-surface: #ffffff;
  --c-border:  #e2e8f0;

  --shadow-xs: 0 1px 2px rgba(15,23,42,.04);
  --shadow-sm: 0 1px 4px rgba(15,23,42,.06), 0 2px 8px rgba(15,23,42,.04);
  --shadow-md: 0 4px 16px rgba(15,23,42,.08), 0 1px 4px rgba(15,23,42,.04);
  --shadow-lg: 0 8px 32px rgba(15,23,42,.12), 0 2px 8px rgba(15,23,42,.06);

  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-xl: 20px;
}

/* ══ 테이블 개선 — 선 최소화, 행 호버 강조 ══ */
.school-tbl thead th:first-child { border-radius: 0; }
.school-tbl thead th:last-child  { border-radius: 0; }
.school-tbl tbody tr:last-child td { border-bottom: none; }
.school-tbl tbody tr { transition: background .12s; }
.school-tbl tbody tr:hover td { background: var(--c-primary-50); }
td.school-name-cell { font-weight: 700; color: var(--c-gray-900); }
td.dept-cell { color: var(--c-gray-500); font-size: 12px; }

/* 로스터 테이블 행 호버 */
.roster-table tbody tr { transition: background .12s; }
.roster-table tbody tr:hover td { background: var(--c-primary-50); }
.roster-table tbody tr:last-child td { border-bottom: none; }

/* ══ 통계 카드 호버 ══ */
.stat-card:hover {
  box-shadow: var(--shadow-md);
  transform: translateY(-3px);
}
.stat-card .stat-icon {
  font-size: 22px;
  margin-bottom: 8px;
  display: block;
}

/* ══ 분석 아이템 개선 ══ */
.a-item {
  background: var(--c-gray-50);
  border-radius: var(--radius-md);
  padding: 14px 16px;
  border: 1px solid var(--c-border);
  transition: box-shadow .15s, border-color .15s;
}
.a-item:hover { box-shadow: var(--shadow-sm); border-color: var(--c-primary-200); }
.a-item label {
  font-size: 11px;
  font-weight: 700;
  color: var(--c-gray-500);
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 8px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}
.a-item .at {
  font-size: 13px;
  color: var(--c-gray-700);
  line-height: 1.7;
  white-space: pre-wrap;
}
.a-item .ae {
  font-size: 12px;
  color: var(--c-gray-300);
  font-style: italic;
}

/* ══ 상담기록 카드 호버 ══ */
.counsel-entry:hover { box-shadow: var(--shadow-sm); }

/* ══ 대시보드 차트 카드 ══ */
.chart-card {
  background: var(--c-surface);
  border-radius: var(--radius-lg);
  padding: 20px 22px;
  border: 1px solid var(--c-border);
  box-shadow: var(--shadow-sm);
  transition: box-shadow .2s;
}
.chart-card:hover { box-shadow: var(--shadow-md); }
.chart-card h4 {
  font-size: 13px;
  font-weight: 700;
  color: var(--c-gray-700);
  margin-bottom: 16px;
  letter-spacing: -0.1px;
}

/* 막대 차트 개선 */
.bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 9px; }
.bar-lbl { font-size: 11px; font-weight: 600; color: var(--c-gray-500); width: 70px; text-align: right; flex-shrink: 0; }
.bar-wrap { flex: 1; background: var(--c-gray-100); border-radius: 6px; height: 20px; overflow: hidden; }
.bar-fill {
  height: 100%;
  border-radius: 6px;
  transition: width .5s cubic-bezier(.4,0,.2,1);
  display: flex;
  align-items: center;
  justify-content: flex-end;
  padding-right: 7px;
}
.bar-val { font-size: 10px; font-weight: 700; color: rgba(255,255,255,.9); }

/* 중복 지원 아이템 */
.overlap-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 7px 0;
  border-bottom: 1px solid var(--c-gray-100);
  font-size: 12px;
  font-weight: 500;
  color: var(--c-gray-700);
}
.overlap-item:last-child { border-bottom: none; }
.overlap-count {
  font-size: 11px;
  font-weight: 700;
  background: var(--c-primary-100);
  color: var(--c-primary-600);
  padding: 2px 9px;
  border-radius: 9px;
}

/* ══ 예비 지원 대학 카드형 ══ */
.reserve-chip {
  background: var(--c-gray-50);
  border: 1px solid var(--c-border);
  border-radius: var(--radius-md);
  padding: 9px 13px;
  font-size: 12px;
  display: flex;
  align-items: center;
  gap: 10px;
  transition: border-color .15s;
}
.reserve-chip:hover { border-color: var(--c-primary-200); }
.reserve-chip b { font-size: 13px; font-weight: 700; color: var(--c-gray-800); }

/* ══ 폼 그룹 개선 ══ */
input[type=text],input[type=password],input[type=tel],input[type=date],textarea,select {
  border: 1.5px solid var(--c-gray-200);
  border-radius: var(--radius-sm);
  padding: 8px 11px;
  width: 100%;
  outline: none;
  background: var(--c-surface);
  transition: border .15s, box-shadow .15s;
  color: var(--c-gray-900);
  font-size: 13px;
}
input[type=text]:hover,input[type=password]:hover,input[type=tel]:hover,input[type=date]:hover,textarea:hover,select:hover {
  border-color: var(--c-gray-300);
}

/* ══ 섹션 구분선 ══ */
.divider { height: 1px; background: var(--c-gray-100); margin: 16px 0; }

/* ══ 학생 앱 콘텐츠 배경 ══ */
.stu-app { min-height: 100vh; background: var(--c-bg); display: flex; flex-direction: column; }
.stu-content { flex: 1; padding: 20px; max-width: 900px; width: 100%; margin: 0 auto; }

/* ══ 스크롤바 스타일 ══ */
.content::-webkit-scrollbar { width: 5px; }
.content::-webkit-scrollbar-track { background: transparent; }
.content::-webkit-scrollbar-thumb { background: var(--c-gray-200); border-radius: 3px; }
.content::-webkit-scrollbar-thumb:hover { background: var(--c-gray-300); }
.s-list::-webkit-scrollbar { width: 3px; }
.s-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,.1); border-radius: 2px; }

/* ══ 로스터 테이블 래퍼 ══ */
.table-wrap {
  border-radius: var(--radius-md);
  overflow: hidden;
  border: 1px solid var(--c-border);
}

/* ══ 점수 차이 표시 개선 ══ */
.score-diff { font-size: 10px; font-weight: 700; display: block; margin-top: 2px; }
.score-diff.over  { color: var(--c-danger-500); }
.score-diff.under { color: var(--c-success-500); }

/* ══ 알림 패널 개선 ══ */
.notif-panel {
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-lg);
  border: 1px solid var(--c-border);
}
.notif-item { border-bottom: 1px solid var(--c-gray-50); transition: background .12s; }
.notif-item:hover { background: var(--c-gray-50); }
.notif-clickable:hover { background: var(--c-primary-50) !important; }

/* ══ 모달 헤더/바디 개선 ══ */
.modal-hd {
  padding: 18px 22px;
  border-bottom: 1px solid var(--c-gray-100);
  background: var(--c-surface);
}
.modal-body { padding: 20px 22px 24px; }
.modal-close {
  border: none;
  background: var(--c-gray-100);
  font-size: 16px;
  cursor: pointer;
  color: var(--c-gray-500);
  padding: 4px 8px;
  border-radius: var(--radius-sm);
  transition: all .15s;
}
.modal-close:hover { background: var(--c-gray-200); color: var(--c-gray-700); }

/* ══ 확인 다이얼로그 ══ */
.cf-box {
  background: var(--c-surface);
  border-radius: var(--radius-xl);
  padding: 26px 24px;
  max-width: 320px;
  width: 90%;
  box-shadow: var(--shadow-lg);
  text-align: center;
  border: 1px solid var(--c-border);
}
.cf-box h3 { font-size: 16px; font-weight: 800; margin-bottom: 8px; letter-spacing: -0.3px; color: var(--c-gray-900); }
.cf-box p  { font-size: 13px; color: var(--c-gray-500); margin-bottom: 20px; line-height: 1.6; }

/* ══ 상담예약 예약 아이템 개선 ══ */
.resv-name { font-size: 14px; font-weight: 700; color: var(--c-primary-600); min-width: 60px; }
.resv-date { font-size: 13px; font-weight: 700; color: var(--c-gray-800); min-width: 100px; }
.resv-slot { font-size: 11px; font-weight: 500; color: var(--c-gray-400); margin-top: 2px; }
.resv-status {
  padding: 3px 11px;
  border-radius: 10px;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.02em;
}

/* ══ 타임라인 개선 ══ */
.tl-card {
  background: var(--c-surface);
  border: 1px solid var(--c-border);
  border-radius: var(--radius-md);
  padding: 13px 16px;
  box-shadow: var(--shadow-xs);
  transition: all .2s cubic-bezier(.4,0,.2,1);
  position: relative;
  overflow: hidden;
}
.tl-card::before {
  content: '';
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 3px;
  border-radius: var(--radius-md) 0 0 var(--radius-md);
}
.tl-item .tl-card.type-1차발표::before { background: var(--c-primary-500); }
.tl-item .tl-card.type-면접::before   { background: var(--c-warning-500); }
.tl-item .tl-card.type-발표::before   { background: var(--c-success-500); }
.tl-card:hover {
  box-shadow: var(--shadow-md);
  transform: translateX(3px);
  border-color: var(--c-primary-200);
}
.tl-type-badge {
  font-size: 10px;
  font-weight: 700;
  padding: 2px 9px;
  border-radius: 8px;
  letter-spacing: 0.02em;
}
.tl-school { font-size: 13px; font-weight: 700; color: var(--c-gray-900); }

/* ══ 퀵 인풋 개선 ══ */
.qi-example {
  background: var(--c-primary-50);
  border: 1px solid var(--c-primary-100);
  border-radius: var(--radius-md);
  padding: 12px 14px;
  font-size: 12px;
  color: var(--c-primary-700);
  margin-bottom: 12px;
  line-height: 1.8;
}
.qi-textarea {
  border: 1.5px solid var(--c-gray-200);
  border-radius: var(--radius-md);
  padding: 12px 14px;
  line-height: 1.8;
  transition: border .15s;
}
.qi-textarea:focus { border-color: var(--c-primary-500); }

/* ══ 비고 박스 ══ */
.note-box {
  background: var(--c-warning-50);
  border: 1px solid var(--c-warning-100);
  border-left: 3px solid var(--c-warning-500);
  border-radius: var(--radius-sm);
  padding: 12px 14px;
  font-size: 13px;
  color: var(--c-warning-700);
  line-height: 1.6;
  font-weight: 500;
}

/* ══ 학생 앱 탭바 개선 ══ */
.stu-tab-wrap {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 16px;
}
.stu-tab-wrap .tab-bar { flex: 1; margin-bottom: 0; }

/* ══════════════════════════════════════════════
   4. 캘린더 슬롯 + 애니메이션 + 컴포넌트 디테일
══════════════════════════════════════════════ */

/* ── 캘린더 전체 ── */
.cal-wrap {
  background: var(--c-surface);
  border-radius: var(--radius-xl);
  padding: 24px;
  box-shadow: var(--shadow-sm);
  border: 1px solid var(--c-border);
}
.cal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
.cal-header h3 { font-size: 20px; font-weight: 800; color: var(--c-gray-900); letter-spacing: -0.5px; }
.cal-nav button {
  width: 34px; height: 34px;
  border: 1.5px solid var(--c-border);
  background: var(--c-surface);
  border-radius: var(--radius-sm);
  cursor: pointer; font-size: 15px;
  display: flex; align-items: center; justify-content: center;
  color: var(--c-gray-500);
  transition: all .15s;
}
.cal-nav button:hover { background: var(--c-primary-50); border-color: var(--c-primary-200); color: var(--c-primary-600); }
.cal-grid { display: grid; grid-template-columns: repeat(7,1fr); gap: 5px; }
.cal-dow {
  text-align: center; font-size: 11px; font-weight: 700;
  color: var(--c-gray-400); padding: 8px 0;
  letter-spacing: 0.04em; text-transform: uppercase;
}
.cal-dow:first-child { color: #f43f5e; }

/* ── 날짜 셀 ── */
.cal-day {
  border: 1.5px solid var(--c-border);
  border-radius: var(--radius-md);
  padding: 9px 8px;
  min-height: 88px;
  background: var(--c-surface);
  transition: border-color .15s, box-shadow .15s;
  vertical-align: top;
  position: relative;
}
.cal-day:hover:not(.past):not(.other-month) {
  border-color: var(--c-primary-200);
  box-shadow: 0 2px 8px rgba(109,95,250,.08);
}
.cal-day.today {
  border-color: var(--c-primary-400);
  background: var(--c-primary-50);
  box-shadow: 0 0 0 3px rgba(109,95,250,.1);
}
.cal-day.other-month { background: var(--c-gray-50); opacity: .45; }
.cal-day.past { opacity: .38; pointer-events: none; background: var(--c-gray-50); }
.cal-day.holiday { background: #fff5f5; }
.cal-day-num {
  font-size: 12px; font-weight: 700;
  color: var(--c-gray-700); margin-bottom: 6px;
  line-height: 1;
}
.cal-day.today .cal-day-num { color: var(--c-primary-600); }
.cal-day-num.sun { color: #f43f5e; }
.cal-day-num.sat { color: var(--c-gray-400); }
.no-consult-label {
  font-size: 10px; font-weight: 500;
  color: var(--c-gray-400); margin-top: 4px;
}

/* ── 슬롯 버튼 (핵심 개선) ── */
.slot-btn {
  display: flex;
  align-items: center;
  gap: 3px;
  width: 100%;
  text-align: left;
  border-radius: 7px;
  padding: 4px 7px;
  font-size: 10px;
  font-weight: 700;
  cursor: pointer;
  margin-top: 4px;
  font-family: 'Pretendard', inherit;
  transition: all .18s cubic-bezier(.4,0,.2,1);
  border: 1.5px solid transparent;
  letter-spacing: -0.1px;
  position: relative;
  overflow: hidden;
}
.slot-btn::after {
  content: '';
  position: absolute;
  inset: 0;
  background: rgba(255,255,255,0);
  transition: background .15s;
}
.slot-btn:hover::after { background: rgba(255,255,255,.15); }

/* 예약 가능 — 초록 */
.slot-available {
  background: var(--c-success-50);
  color: var(--c-success-700);
  border-color: #a7f3d0;
}
.slot-available::before { content: '✓ '; }
.slot-available:hover {
  background: var(--c-success-500);
  color: #fff;
  border-color: var(--c-success-500);
  transform: translateY(-1px);
  box-shadow: 0 3px 10px rgba(16,185,129,.28);
}

/* 예약 마감 — 빨강 */
.slot-full {
  background: var(--c-danger-50);
  color: var(--c-danger-500);
  border-color: #fecdd3;
  cursor: not-allowed;
  opacity: .75;
}
.slot-full::before { content: '✕ '; }

/* 내 예약 — 보라 */
.slot-mine {
  background: var(--c-primary-100);
  color: var(--c-primary-700);
  border-color: var(--c-primary-200);
}
.slot-mine::before { content: '★ '; }
.slot-mine:hover {
  background: var(--c-primary-500);
  color: #fff;
  border-color: var(--c-primary-500);
  transform: translateY(-1px);
  box-shadow: 0 3px 10px rgba(109,95,250,.28);
}

/* 신청 대기 — 노랑 */
.slot-pending {
  background: var(--c-warning-50);
  color: var(--c-warning-700);
  border-color: #fde68a;
  animation: pulse-warn 2s ease-in-out infinite;
}
.slot-pending::before { content: '⏳ '; }

/* 확정 — 진초록 */
.slot-confirmed {
  background: #eff6ff;
  color: #1d4ed8;
  border-color: #93c5fd;
  font-weight: 800;
}
.slot-confirmed::before { content: '✓ '; }

/* 대기 펄스 애니메이션 */
@keyframes pulse-warn {
  0%, 100% { box-shadow: 0 0 0 0 rgba(245,158,11,.3); }
  50%       { box-shadow: 0 0 0 4px rgba(245,158,11,.0); }
}

/* D-DAY 뱃지 */
.dday-badge {
  display: inline-flex;
  align-items: center;
  padding: 2px 8px;
  border-radius: 8px;
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 0.02em;
}
.dday-today { background: #f43f5e; color: #fff; animation: pulse-red .9s ease-in-out infinite; }
.dday-soon  { background: var(--c-primary-100); color: var(--c-primary-700); }
.dday-past  { color: var(--c-gray-400); font-weight: 500; }
@keyframes pulse-red {
  0%,100% { box-shadow: 0 0 0 0 rgba(244,63,94,.5); }
  50%      { box-shadow: 0 0 0 5px rgba(244,63,94,.0); }
}

/* ── 사이드바 Shimmer ── */
.s-item {
  position: relative;
  overflow: hidden;
}
.s-item::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,.04) 50%, transparent 100%);
  transform: translateX(-100%);
  transition: transform .5s ease;
}
.s-item:hover::before { transform: translateX(100%); }

/* ── 버튼 클릭 리플 ── */
.btn { position: relative; overflow: hidden; }
.btn::after {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(circle, rgba(255,255,255,.25) 0%, transparent 70%);
  opacity: 0;
  transition: opacity .3s;
}
.btn:active::after { opacity: 1; }

/* ── 역할 카드 진입 애니메이션 ── */
@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(16px); }
  to   { opacity: 1; transform: translateY(0); }
}
#landingPage .lc { animation: fadeInUp .35s ease; }

/* ── 통계 카드 진입 ── */
@keyframes fadeInScale {
  from { opacity: 0; transform: scale(.97); }
  to   { opacity: 1; transform: scale(1); }
}
.stat-card { animation: fadeInScale .3s ease; }

/* ── 모달 진입 ── */
@keyframes slideUp {
  from { opacity: 0; transform: translateY(24px) scale(.98); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}
.modal { animation: slideUp .25s cubic-bezier(.4,0,.2,1); }

/* ── 토스트 애니메이션 ── */
@keyframes toastIn {
  from { opacity: 0; transform: translateY(12px); }
  to   { opacity: 1; transform: translateY(0); }
}
.toast.show { animation: toastIn .2s ease; }

/* ── 알림 패널 진입 ── */
@keyframes dropDown {
  from { opacity: 0; transform: translateY(-8px) scale(.97); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}
.notif-panel:not(.hidden) { animation: dropDown .2s cubic-bezier(.4,0,.2,1); }

/* ── 상담기록 진입 ── */
.counsel-entry {
  animation: fadeInUp .2s ease;
}

/* ── 학생 리스트 아이템 ── */
.s-item { animation: none; }

/* ── 스켈레톤 로딩 (폴링 중 표시용) ── */
@keyframes shimmer {
  0%   { background-position: -400px 0; }
  100% { background-position: 400px 0; }
}
.skeleton {
  background: linear-gradient(90deg, var(--c-gray-100) 25%, var(--c-gray-50) 50%, var(--c-gray-100) 75%);
  background-size: 800px 100%;
  animation: shimmer 1.4s ease-in-out infinite;
  border-radius: var(--radius-sm);
  height: 14px;
}

/* ── 스크롤 최상단 fade ── */
.content { scroll-behavior: smooth; }

/* ── 신호등 개선 ── */
.traffic-light {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 11px; font-weight: 700;
  padding: 3px 9px; border-radius: 10px;
  letter-spacing: -0.1px;
}

/* ── 태그 배지 개선 ── */
.badge {
  display: inline-flex; align-items: center;
  padding: 3px 10px; border-radius: 10px;
  font-size: 11px; font-weight: 700;
  letter-spacing: -0.1px;
}

/* ── 예약 현황 카드 ── */
.resv-status {
  padding: 3px 11px;
  border-radius: 10px;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.01em;
  white-space: nowrap;
}

/* ── 예약 타임라인 점 ── */
.tl-dot {
  position: absolute; left: -23px; top: 6px;
  width: 13px; height: 13px;
  border-radius: 50%;
  border: 2.5px solid var(--c-bg);
  box-shadow: 0 0 0 2px currentColor;
  transition: transform .2s;
}
.tl-item:hover .tl-dot { transform: scale(1.2); }
.tl-dot.type-1차발표 { color: var(--c-primary-500); background: var(--c-primary-500); }
.tl-dot.type-면접    { color: var(--c-warning-500); background: var(--c-warning-500); }
.tl-dot.type-발표    { color: var(--c-success-500); background: var(--c-success-500); }

/* ── 링크 코드 hover ── */
.link-code:hover { background: var(--c-primary-50); cursor: default; }



/* ══ 희망대학 표 배지/텍스트 정렬 수정 ══ */
.school-tbl .badge {
  white-space: nowrap;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 44px;
  padding: 4px 10px;
  border-radius: 10px;
  font-size: 11px;
  font-weight: 700;
}
.school-tbl tbody td {
  white-space: nowrap;
  vertical-align: middle;
}
.school-tbl tbody td:first-child {
  white-space: normal; /* 대학명은 줄바꿈 허용 */
  min-width: 100px;
}
.school-tbl tbody td:nth-child(2) {
  white-space: normal; /* 학과도 줄바꿈 허용 */
  min-width: 80px;
}
/* 면접 있음/없음 뱃지 */
.school-tbl .int-badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 3px 9px;
  border-radius: 9px;
  font-size: 11px;
  font-weight: 700;
  white-space: nowrap;
}
/* 신호등 줄바꿈 방지 */
.traffic-light {
  white-space: nowrap;
  min-width: 52px;
  justify-content: center;
}
/* note-chip 처리 */
.note-chip {
  display: block;
  font-size: 10px;
  color: var(--c-warning-500);
  margin-top: 3px;
  font-weight: 600;
  white-space: normal;
}
/* 날짜 표시 */
.school-tbl .date-mini {
  font-size: 10px;
  color: var(--c-gray-400);
  margin-top: 3px;
  font-weight: 500;
  white-space: normal;
  line-height: 1.5;
}
/* 관리 버튼 셀 */
.school-tbl td:last-child {
  white-space: nowrap;
  text-align: center;
}
/* 점수 셀 */
.school-tbl .score-cell {
  text-align: center;
  font-variant-numeric: tabular-nums;
  font-weight: 600;
}
/* ══ 모바일/태블릿 반응형 ══ */
.hamburger{display:none;align-items:center;justify-content:center;width:38px;height:38px;border:none;background:transparent;font-size:22px;cursor:pointer;color:var(--c-gray-600);border-radius:var(--radius-sm);flex-shrink:0;transition:background .15s}
.hamburger:hover{background:var(--c-gray-100)}
.sb-overlay{display:none;position:fixed;inset:0;background:rgba(15,23,42,.5);backdrop-filter:blur(2px);z-index:499}
.sb-overlay.show{display:block}

/* ── 태블릿 (769~1024px) ── */
@media(min-width:769px) and (max-width:1024px){
  .sidebar{width:210px}
  .content{padding:16px 18px}
  .cal-day{min-height:82px}
  .school-tbl{font-size:12px}
  .ov-grid{grid-template-columns:repeat(3,1fr)}
}

/* ── 모바일 (≤768px) ── */
@media(max-width:768px){
  /* 앱 레이아웃 */
  .app{overflow:visible;flex-direction:column}
  .hamburger{display:flex}

  /* 사이드바 — 오버레이 슬라이드 */
  .sidebar{
    position:fixed;left:-260px;top:0;bottom:0;
    height:100dvh;width:260px;
    z-index:500;
    transition:left .28s cubic-bezier(.4,0,.2,1);
    overflow-y:auto;
  }
  .sidebar.open{left:0;box-shadow:8px 0 32px rgba(15,23,42,.25)}
  .main{width:100%;min-width:0}

  /* 탑바 */
  .topbar{
    padding:10px 14px;gap:8px;
    flex-wrap:nowrap;
    position:sticky;top:0;z-index:100;
  }
  .topbar h2{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:130px;min-width:0}
  #topbarActions{gap:4px;flex-shrink:0}
  #topbarActions .btn{padding:6px 9px;font-size:11px}
  #topbarActions .btn-sm{padding:5px 8px;font-size:11px}

  /* 컨텐츠 */
  .content{padding:14px 14px;overflow-x:hidden}

  /* 통계 카드 */
  .ov-grid{grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
  .stat-card{padding:14px 16px}
  .stat-card .sn{font-size:24px}
  .stat-card .stat-icon{font-size:18px;margin-bottom:6px}

  /* 학생 상세 헤더 */
  .dh{flex-direction:column;gap:10px;padding:14px 16px}
  .dh-name{font-size:18px}
  .dh-actions{flex-direction:row;flex-wrap:wrap;gap:6px}

  /* 탭바 */
  .tab-bar{
    overflow-x:auto;-webkit-overflow-scrolling:touch;
    scrollbar-width:none;flex-wrap:nowrap;
    border-radius:var(--radius-sm);
  }
  .tab-bar::-webkit-scrollbar{display:none}
  .tab-btn{white-space:nowrap;flex-shrink:0;font-size:11px;padding:6px 10px}

  /* 희망대학 표 — 가로 스크롤 */
  .card-body{padding:14px 16px}
  .school-tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .school-tbl{font-size:11px;min-width:640px}
  .school-tbl thead th{padding:8px 8px;font-size:10px}
  .school-tbl tbody td{padding:9px 8px;font-size:11px}
  .badge{font-size:10px;padding:3px 7px;min-width:36px}
  .int-badge{font-size:10px;padding:2px 6px}
  .traffic-light{font-size:10px;padding:3px 6px;min-width:44px}

  /* 연락처 */
  .contact-grid{grid-template-columns:1fr}

  /* 생기부 */
  .a-grid{grid-template-columns:1fr}
  .a-item.full{grid-column:1}

  /* 상담기록 */
  .counsel-entry{padding:12px}

  /* 캘린더 */
  .cal-wrap{padding:14px 12px;border-radius:var(--radius-lg)}
  .cal-header{margin-bottom:14px}
  .cal-header h3{font-size:16px}
  .cal-grid{gap:3px}
  .cal-day{min-height:66px;padding:6px 4px;border-radius:var(--radius-sm)}
  .cal-day-num{font-size:11px;margin-bottom:4px}
  .slot-btn{font-size:9px;padding:3px 4px;border-radius:5px;margin-top:3px}
  .slot-btn::before{display:none}
  .cal-dow{font-size:10px;padding:5px 0}

  /* 모달 — 하단 시트 */
  .modal-overlay{align-items:flex-end;padding:0}
  .modal{
    border-radius:20px 20px 0 0;
    max-height:92dvh;
    max-width:100%!important;
    width:100%;
  }
  .modal-hd{padding:16px 18px}
  .modal-body{padding:16px 18px 32px}

  /* 알림 패널 */
  .notif-panel{
    position:fixed;
    top:auto;bottom:0;left:0;right:0;
    width:100%;
    border-radius:20px 20px 0 0;
    max-height:70dvh;
  }

  /* 대시보드 */
  .dash-grid{grid-template-columns:1fr;gap:10px}

  /* 빠른입력 */
  .qi-layout{grid-template-columns:1fr}
  .qi-textarea{min-height:110px}

  /* 학생앱 */
  .stu-app{min-height:100dvh}
  .stu-content{padding:14px}
  .stu-topbar{padding:11px 14px;gap:8px}
  .stu-topbar h1{font-size:13px}
  .stu-name-badge{font-size:11px;padding:3px 10px}

  /* 예약 아이템 */
  .resv-item{flex-wrap:wrap;gap:8px;padding:12px 14px}
  .resv-date{min-width:auto;font-size:12px}
  .resv-name{font-size:13px}
  .resv-slot{font-size:10px}

  /* 로스터 테이블 */
  .roster-table{font-size:12px}
  .roster-table th,.roster-table td{padding:8px 9px}
  .table-wrap{margin:0 -16px;border-radius:0;border-left:none;border-right:none}

  /* 로그인 */
  .lc{padding:26px 20px;border-radius:var(--radius-xl)}
  .lc h2{font-size:20px}
  .role-grid{gap:10px}
  .role-card{padding:16px 12px;border-radius:var(--radius-lg)}
  .role-card .ri{font-size:26px}

  /* 버튼 터치 최적화 */
  .btn{padding:9px 13px;font-size:13px;min-height:40px}
  .btn-sm{padding:6px 10px;font-size:12px;min-height:34px}

  /* 폼 */
  input[type=text],input[type=password],input[type=tel],input[type=date],textarea,select{
    font-size:16px; /* iOS 줌 방지 */
    padding:10px 13px;
    min-height:44px;
  }
  textarea{font-size:14px;min-height:auto}

  /* 확인 다이얼로그 */
  .cf-overlay{padding:0 16px}
  .cf-box{border-radius:var(--radius-xl);padding:24px 20px;max-width:100%;width:100%}
}

/* ── 소형 모바일 (≤390px) ── */
@media(max-width:390px){
  .topbar h2{max-width:100px;font-size:13px}
  .ov-grid{grid-template-columns:1fr 1fr;gap:8px}
  .stat-card{padding:12px 13px}
  .stat-card .sn{font-size:22px}
  .cal-grid{gap:2px}
  .cal-day{min-height:58px;padding:5px 3px}
  .slot-btn{font-size:8px;padding:2px 3px}
  .tab-btn{font-size:10px;padding:5px 8px}
  .dh-name{font-size:16px}
  .lc{padding:22px 16px}
  .lc h2{font-size:18px}
}

/* ══ Apps Script 모바일 강제 적용 ══ */
html {
  -webkit-text-size-adjust: 100%;
  -ms-text-size-adjust: 100%;
  text-size-adjust: 100%;
  touch-action: manipulation;
}
body {
  min-height: 100dvh;
  min-height: -webkit-fill-available;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
}

/* 랜딩 페이지 — 화면 가득 채우기 */
#landingPage, #loginPage, #studentLoginPage {
  min-height: 100dvh;
  min-height: -webkit-fill-available;
  padding: 20px 16px;
}

/* 랜딩 카드 — 모바일에서 더 크게 */
@media(max-width:768px) {
  #landingPage .lc,
  #loginPage .lc,
  #studentLoginPage .lc {
    max-width: 100%;
    padding: 28px 22px;
    border-radius: 20px;
  }
  .lc h2 { font-size: 22px; }
  .role-grid { grid-template-columns: 1fr 1fr; gap: 12px; }
  .role-card {
    padding: 20px 14px;
    border-radius: 16px;
  }
  .role-card .ri { font-size: 32px; margin-bottom: 8px; }
  .role-card h3 { font-size: 15px; }
  .role-card p  { font-size: 12px; }

  /* 앱 전체 높이 */
  .app { height: 100dvh; height: -webkit-fill-available; }

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
// ══════════════════════════════════════════════
// 상담 타임 관리
// ══════════════════════════════════════════════
function showManageSlots() {
  renderManageSlotsModal();
}

function renderManageSlotsModal() {
  var slotItems = CONSULT_SLOTS.map(function(s, i){
    return '<div class="slot-manage-item" data-sid="'+s.id+'">'
      +'<div class="slot-num">'+(i+1)+'</div>'
      +'<div class="slot-info">'
      +'<input class="slot-name-input" type="text" value="'+esc(s.label)+'" data-field="label" data-idx="'+i+'" placeholder="타임명">'
      +'<div class="slot-time-row">'
      +'<select class="slot-time-input" data-field="startTime" data-idx="'+i+'">'+timeOptions(s.startTime)+'</select>'
      +'<span class="slot-sep">~</span>'
      +'<select class="slot-time-input" data-field="endTime" data-idx="'+i+'">'+timeOptions(s.endTime)+'</select>'
      +'</div>'
      +'</div>'
      +(CONSULT_SLOTS.length > 1
        ? '<button class="btn btn-danger btn-sm" data-delidx="'+i+'">🗑</button>'
        : '')
      +'</div>';
  }).join('');

  // 현재 예약 있는 슬롯 확인
  var hasResvSlots = RESERVATIONS.length > 0;

  openModalSm('⏱ 상담 타임 관리',
    (hasResvSlots ? '<div class="slot-warning">⚠️ 예약이 있는 상태에서 타임을 수정하면 기존 예약 표시에 영향을 줄 수 있어요.</div>' : '')
    +'<div id="slotList">'+slotItems+'</div>'
    +'<button class="slot-add-btn" id="btnAddSlot">+ 타임 추가</button>'
    +'<div style="display:flex;gap:8px;margin-top:16px">'
    +'<button class="btn btn-secondary" style="flex:1" onclick="closeModal()">취소</button>'
    +'<button class="btn btn-primary" style="flex:1" id="btnSaveSlots">💾 저장</button>'
    +'</div>'
  );

  // 이벤트 바인딩
  // 필드 변경
  document.querySelectorAll('.slot-name-input, .slot-time-input').forEach(function(inp){
    inp.addEventListener('change', function(){
      var idx = parseInt(this.dataset.idx);
      var field = this.dataset.field;
      CONSULT_SLOTS[idx][field] = this.value.trim();
    });
  });

  // 삭제
  document.querySelectorAll('[data-delidx]').forEach(function(btn){
    btn.addEventListener('click', function(){
      var idx = parseInt(this.dataset.delidx);
      var slot = CONSULT_SLOTS[idx];
      // 해당 슬롯에 예약이 있으면 경고
      var hasResv = RESERVATIONS.some(function(r){ return r.slot === slot.id; });
      if(hasResv) {
        toast('❌ 이 타임에 예약이 있어서 삭제할 수 없어요');
        return;
      }
      CONSULT_SLOTS.splice(idx, 1);
      renderManageSlotsModal();
    });
  });

  // 추가
  on('btnAddSlot', 'click', function(){
    var newId = Math.max.apply(null, CONSULT_SLOTS.map(function(s){return s.id;})) + 1;
    var lastSlot = CONSULT_SLOTS[CONSULT_SLOTS.length - 1];
    // 마지막 슬롯 종료 시간을 기본으로
    CONSULT_SLOTS.push({
      id: newId,
      label: (CONSULT_SLOTS.length + 1) + '타임',
      startTime: lastSlot ? lastSlot.endTime : '17:00',
      endTime: lastSlot ? addHour(lastSlot.endTime) : '18:00'
    });
    renderManageSlotsModal();
  });

  // 저장
  on('btnSaveSlots', 'click', function(){
    // 유효성 검사
    var valid = CONSULT_SLOTS.every(function(s){
      return s.label && s.startTime && s.endTime && s.startTime < s.endTime;
    });
    if(!valid) { toast('❌ 타임명과 시간을 올바르게 입력해주세요 (시작 < 종료)'); return; }
    buildSlotLabels();
    saveSlots();
    closeModal();
    toast('✅ 상담 타임이 저장됐어요');
    renderResvCalendar();
  });
}

function addHour(timeStr) {
  var parts = (timeStr||'17:00').split(':');
  var h = parseInt(parts[0]) + 1;
  if(h >= 24) h = 23;
  var m = parts[1] || '00';
  // 10분 단위로 맞추기
  var mInt = Math.round(parseInt(m)/10)*10;
  if(mInt >= 60) { h = Math.min(h+1, 23); mInt = 0; }
  return (h < 10 ? '0' : '') + h + ':' + (mInt === 0 ? '00' : mInt);
}

// renderSlotBtn에서 CONSULT_SLOTS 기반으로 슬롯 렌더링
function getSlotStatus(dateStr, slotId, isTeacher) {
  // 마감 처리된 슬롯 확인
  if(BLOCKED_SLOTS[dateStr] && BLOCKED_SLOTS[dateStr].indexOf(slotId) !== -1) return 'full';
  var resv = RESERVATIONS.find(function(r){ return r.date===dateStr && r.slot===slotId; });
  if(!resv) return 'available';
  if(resv.status==='confirmed') return 'confirmed';
  if(resv.status==='pending') return 'pending';
  if(resv.status==='teacher') return 'confirmed';
  return 'available';
}

function getSlotResv(dateStr, slotId) {
  return RESERVATIONS.find(function(r){ return r.date===dateStr && r.slot===slotId; });
}
</script>
<script>
// ══════════════════════════════════════════════
// 분석 모달 (교사용 — 학생 상세에서 열기)
// ══════════════════════════════════════════════
function showAnalysisModal(num) {

    + '</div>'
    + '<div class="analysis-modal-body">'+html+'</div>'
    + '</div>';

  document.body.appendChild(overlay);

  // 닫기 이벤트
  document.getElementById('btnCloseAnalysisModal').addEventListener('click', function(){
    overlay.remove();
    currentTab = 'schools';
    showStudent(num);
  });
  overlay.addEventListener('click', function(e){
    if(e.target === overlay){ overlay.remove(); currentTab='schools'; showStudent(num); }
  });

  // 차트 렌더링
  setTimeout(function(){ renderAnalysisChart(s, 'analysisModalChart'); }, 80);

// ══════════════════════════════════════════════
// 분석 모달 (학생용)
// ══════════════════════════════════════════════
function showStudentAnalysisModal(num) {
  var s = DB.find(function(x){ return x.student_num===num; });
  if(!s) return;

  var existing = document.getElementById('analysisModalOverlay');
  if(existing) existing.remove();

  var overlay = document.createElement('div');
  overlay.className = 'analysis-modal-overlay';
  overlay.id = 'analysisModalOverlay';

  overlay.innerHTML = '<div class="analysis-modal" id="analysisModalBox">'
    + '<div class="analysis-modal-hd">'
    +   '<div><div class="analysis-name">내 지원 전략 분석</div>'
    +   '<div class="analysis-sub">희망학과: '+(s.hope_dept||'미정')+'</div></div>'
    +   '<button class="analysis-modal-close" id="btnCloseAnalysisModal">✕</button>'

    + '</div>';

  document.body.appendChild(overlay);

  document.getElementById('btnCloseAnalysisModal').addEventListener('click', function(){

  overlay.addEventListener('click', function(e){

// ── 분석 HTML 빌드 (교사/학생 공용) ──
function buildAnalysisHTML(s) {
  var hs = s.hope_schools || [];
  if(!hs.length) return '<div style="text-align:center;color:var(--c-gray-400);padding:40px;font-style:italic">희망 대학이 등록되지 않았습니다</div>';

  var dirCount = {상향:0,소신:0,적정:0,하향:0,미정:0};
  var diffs = [], hasCsat=0, interviewCnt=0;
  hs.forEach(function(h){
    var d=h.direction||'미정'; if(dirCount[d]!==undefined) dirCount[d]++; else dirCount['미정']++;
    var u=parseFloat(h.uni_score), t=parseFloat(h.stu_score);
    if(!isNaN(u)&&!isNaN(t)) diffs.push(t-u);
    if(h.csat_min&&h.csat_min!=='없음') hasCsat++;
    if(h.interview==='있음') interviewCnt++;
  });
  var avgDiff = diffs.length ? diffs.reduce(function(a,b){return a+b;},0)/diffs.length : null;
  var upRatio = ((dirCount['상향']||0)+(dirCount['소신']||0)) / hs.length;
  var riskLevel = upRatio>0.65?'danger':upRatio>0.4?'warn':'safe';

  // 대학 테이블
  var rows = hs.map(function(h){

      +'<td style="font-variant-numeric:tabular-nums;font-weight:600;color:var(--c-gray-700)">'+(h.stu_score||'-')+'</td>'

      +'<td>'+intH+'</td>'
      +'<td>'+csatH+'</td>'

  // 상담 포인트
  var insights=[];
  if(avgDiff!==null&&avgDiff>0.2) insights.push('평균 내신이 커트라인보다 <b>'+avgDiff.toFixed(2)+'등급 낮아요.</b> 하향 안전망을 강화하세요.');
  if(dirCount['하향']===0) insights.push('하향 안전 대학이 없어요. 최소 1~2곳 추가를 권장해요.');
  if(hasCsat>0) insights.push('수능 최저가 있는 대학이 <b>'+hasCsat+'곳</b>이에요. 수능 대비를 병행해야 해요.');
  if(interviewCnt>0) insights.push('면접 전형이 <b>'+interviewCnt+'곳</b>이에요. 면접 준비를 서두르세요.');

    // 위험도 + 지표

    +'<div class="metric-cell"><div class="metric-big '+(hasCsat>0?'amber':'green')+'">'+hasCsat+'</div><div class="metric-lbl">수능 최저</div></div>'
    +'<div class="metric-cell"><div class="metric-big '+diffColor+'">'+(avgDiff!==null?(avgDiff>0?'+':'')+avgDiff.toFixed(2):'N/A')+'</div><div class="metric-lbl">평균내신차</div></div>'
    +'</div>'
    // 전략 바

    +'</tr></thead><tbody>'+rows+'</tbody></table></div>'

    +insightHtml
    // 차트

}

// ── 차트 렌더링 (모달용) ──
function renderAnalysisChart(s, canvasId) {
  if(typeof Chart === 'undefined') return;
  var ctx = document.getElementById(canvasId);
  if(!ctx) return;
  var hs = s.hope_schools||[];
  var labels = hs.map(function(h){return h.school;});
  var data = hs.map(function(h){
    var u=parseFloat(h.uni_score), t=parseFloat(h.stu_score);
    return(!isNaN(u)&&!isNaN(t))?parseFloat((t-u).toFixed(2)):0;
  });
  var colors = data.map(function(d){return d<=-0.3?'#639922':d<=0.3?'#EF9F27':'#E24B4A';});
  new Chart(ctx,{
    type:'bar',
    data:{labels:labels,datasets:[{label:'내신차이',data:data,backgroundColor:colors,borderRadius:6,borderSkipped:false}]},
    options:{
      indexAxis:'y', responsive:true, maintainAspectRatio:false,
      plugins:{legend:{display:false},tooltip:{callbacks:{label:function(c){return(c.raw>0?'+':'')+c.raw.toFixed(2)+' 등급';}}}}  ,
      scales:{
        x:{grid:{color:'rgba(128,128,128,.1)'},ticks:{font:{size:11},callback:function(v){return(v>0?'+':'')+v.toFixed(1);}},border:{dash:[4,4]}},
        y:{grid:{display:false},ticks:{font:{size:12}}}
      }
    }
  });
}

  (r3.data || []).forEach(function(s) { settings[s.key] = s.value; });
  return {
    resvs: resvs,
    notifs: notifs,
    dateOverrides: settings['date_overrides'] || {},
    blockedSlots:  settings['blocked_slots']  || {},
    consultSlots:  settings['consult_slots']  || null
  };
}

async function sbSaveResv(resvs, notifs, dateOverrides, blockedSlots) {
  // 예약: delete-insert 방식 (예약은 많지 않아서 OK)
  await _sb.from('reservations').delete().neq('id', 0);
  if (resvs && resvs.length) {
    var rows = resvs.map(function(r) {
      return { id: r.id, date: r.date, slot: r.slot,
               student_num: r.studentNum, student_name: r.studentName,
               status: r.status, memo: r.memo || '',
               created_at: r.createdAt || new Date().toISOString() };
    });
    var { error } = await _sb.from('reservations').insert(rows);
    if (error) throw error;
  }
  // 알림: 최근 50개만 유지
  await _sb.from('notifications').delete().neq('id', 0);
  if (notifs && notifs.length) {
    var nrows = notifs.slice(0, 50).map(function(n) {
      return { id: n.id, msg: n.msg, target: n.target, link: n.link || '',
               read: n.read, time: n.time || '' };
    });
    await _sb.from('notifications').insert(nrows);
  }
  // 설정 upsert
  await _sb.from('app_settings').upsert([
    { key: 'date_overrides', value: dateOverrides || {}, updated_at: new Date().toISOString() },
    { key: 'blocked_slots',  value: blockedSlots  || {}, updated_at: new Date().toISOString() }
  ], { onConflict: 'key' });
  return true;
}

async function sbSaveConsultSlots(slots) {
  await _sb.from('app_settings').upsert(
    { key: 'consult_slots', value: slots, updated_at: new Date().toISOString() },
    { onConflict: 'key' }
  );
}

async function sbCheckPwd(pwd) {
  var { data } = await _sb.from('app_settings').select('value').eq('key','teacher_pwd').single();
  return data && data.value === pwd;
}

async function sbSetPwd(pwd) {
  await _sb.from('app_settings').upsert(
    { key: 'teacher_pwd', value: pwd, updated_at: new Date().toISOString() },
    { onConflict: 'key' }
  );
}

// ══════════════════════════════════════════════
// Realtime 구독 — 예약/알림/학생 변경 즉시 반영
// ══════════════════════════════════════════════
var _realtimeChannel = null;
function startRealtime() {
  if (!_sb || _realtimeChannel) return;
  _realtimeChannel = _sb.channel('app-realtime', {
    config: { broadcast: { self: false }, presence: { key: '' } }
  })

    // ── 예약 변경 → payload로 직접 메모리 업데이트 (재요청 없음)
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'reservations' }, function(payload) {
      var r = payload.new;
      if (!RESERVATIONS.find(function(x){ return x.id === r.id; })) {
        RESERVATIONS.push({ id:r.id, date:r.date, slot:r.slot, studentNum:r.student_num,
          studentName:r.student_name, status:r.status, memo:r.memo, createdAt:r.created_at });
      }
      if (role === 'teacher' && navMode === 'resv') renderResvCalendar();
      if (role === 'student' && stuTab === 'resv') renderStuResvCalendar();
    })
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'reservations' }, function(payload) {
      var r = payload.new;
      var idx = RESERVATIONS.findIndex(function(x){ return x.id === r.id; });
      if (idx >= 0) RESERVATIONS[idx].status = r.status;
      if (role === 'teacher' && navMode === 'resv') renderResvCalendar();
      if (role === 'student' && stuTab === 'resv') renderStuResvCalendar();
    })
    .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'reservations' }, function(payload) {
      RESERVATIONS = RESERVATIONS.filter(function(x){ return x.id !== payload.old.id; });
      if (role === 'teacher' && navMode === 'resv') renderResvCalendar();
      if (role === 'student' && stuTab === 'resv') renderStuResvCalendar();
    })
    // ── 알림 변경
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'notifications' }, function(payload) {
      var n = payload.new;
      if (!NOTIFICATIONS.find(function(x){ return x.id === n.id; })) {
        NOTIFICATIONS.unshift({ id:n.id, msg:n.msg, target:n.target, link:n.link, read:n.read, time:n.time });
        if (NOTIFICATIONS.length > 50) NOTIFICATIONS = NOTIFICATIONS.slice(0, 50);
      }
      updateNotifBadge();
    })
    // ── 설정 변경 (마감·타임) → 캘린더 즉시 갱신
    .on('postgres_changes', { event: '*', schema: 'public', table: 'app_settings' }, function(payload) {
      if (!payload.new) return;
      var key = payload.new.key, val = payload.new.value;
      if (key === 'date_overrides') DATE_SLOT_OVERRIDES = val || {};
      if (key === 'blocked_slots')  BLOCKED_SLOTS = val || {};
      if (key === 'consult_slots')  { CONSULT_SLOTS = val || CONSULT_SLOTS; buildSlotLabels(); }
      if (role === 'teacher' && navMode === 'resv') renderResvCalendar();
      if (role === 'student' && stuTab === 'resv') renderStuResvCalendar();
    })

    // ── 학생 데이터 변경 → 교사·학생 양쪽 반영
    .on('postgres_changes', { event: '*', schema: 'public', table: 'students' }, function(payload) {
      if (!payload.new) return;
      var updated = payload.new;

      // 1) 메모리 DB 업데이트 (저장 중인 내 데이터는 건드리지 않음)
      var s = DB.find(function(x) { return x.student_num === updated.student_num; });
      var isMine = _isSaving && (
        (role === 'teacher' && currentNum === updated.student_num) ||
        (role === 'student' && stuSession && stuSession.student_num === updated.student_num)
      );
      if (s && !isMine) {
        s.name               = updated.name || s.name;
        s.gender             = updated.gender || s.gender;
        s.phone              = updated.phone || '';
        s.mom_phone          = updated.mom_phone || '';
        s.dad_phone          = updated.dad_phone || '';
        s.career_hope        = updated.career_hope || '';
        s.hope_dept          = updated.hope_dept || '';
        s.remark             = updated.remark || '';
        s.hope_schools       = updated.hope_schools || [];
        s.reserve_schools    = updated.reserve_schools || [];
        s.counseling_records = updated.counseling_records || [];
        s.analysis           = updated.analysis || {};
      }

      // 2) 교사 화면 갱신
      if (role === 'teacher' && !isMine) {
        // 사이드바 희망학과 업데이트
        renderSidebar();
        // 해당 학생 상세 보고 있으면 즉시 갱신
        if (currentNum === updated.student_num) {
          renderDetail(DB.find(function(x) { return x.student_num === currentNum; }) || {});
        }
      }

      // 3) 학생 본인 화면 갱신 (교사가 수정한 경우)
      if (role === 'student' && stuSession && stuSession.student_num === updated.student_num && !isMine) {
        renderStudentApp();
        toast('✅ 선생님이 내 정보를 업데이트했어요');
      }
    })
    .subscribe(function(status, err) {
      if (status === 'SUBSCRIBED') {
        console.log('✅ Realtime connected');
      } else if (status === 'CHANNEL_ERROR') {
        console.warn('Realtime error, reconnecting...', err);
        setTimeout(function() {
          stopRealtime();
          startRealtime();
        }, 2000);
      } else if (status === 'TIMED_OUT') {
        console.warn('Realtime timed out, reconnecting...');
        setTimeout(function() {
          stopRealtime();
          startRealtime();
        }, 1000);
      }
    });
}

function stopRealtime() {
  if (_realtimeChannel) { _sb.removeChannel(_realtimeChannel); _realtimeChannel = null; }
}

window.onload = async function() {
  function setVh() {
    var vh = window.innerHeight * 0.01;
    document.documentElement.style.setProperty('--vh', vh + 'px');
  }
  setVh();
  window.addEventListener('resize', setVh);
  window.addEventListener('orientationchange', function(){ setTimeout(setVh, 200); });
  bindEvents();

  // Supabase 초기화
  initSupabase();

  if (isSupabase()) {
    // ── Supabase 모드 (운영) ──
    try {
      DB = await sbLoad();
      if (!DB || !DB.length) DB = SAMPLE_DB;
      var resvData = await sbLoadResv();
      RESERVATIONS = resvData.resvs || [];
      NOTIFICATIONS = resvData.notifs || [];
      DATE_SLOT_OVERRIDES = resvData.dateOverrides || {};
      BLOCKED_SLOTS = resvData.blockedSlots || {};
      if (resvData.consultSlots) { CONSULT_SLOTS = resvData.consultSlots; buildSlotLabels(); }
      hide('loadingScreen');
      showPage('landing');
    } catch(e) {
      console.error('Supabase load error', e);
      DB = SAMPLE_DB;
      hide('loadingScreen');
      showPage('landing');
      toast('⚠️ DB 연결 실패 — 설정을 확인해주세요');
    }
  } else if (typeof google !== 'undefined' && google.script) {
    // ── GAS 모드 (하위 호환) ──
    google.script.run
      .withSuccessHandler(function(arr) {
        DB = (arr && arr.length) ? arr : SAMPLE_DB;
        hide('loadingScreen');
        showPage('landing');
      })
      .withFailureHandler(function() {
        try {
          var savedDB = localStorage.getItem('db_39_local');
          DB = (savedDB && JSON.parse(savedDB).length) ? JSON.parse(savedDB) : SAMPLE_DB;
        } catch(e2) { DB = SAMPLE_DB; }
        hide('loadingScreen');
        showPage('landing');
        toast('⚠️ 서버 연결 실패');
      })
      .load();
    loadSlots(); loadDateOverrides(); loadBlockedSlots(); loadResvData();
  } else {
    // ── 로컬 모드 (개발/테스트) ──
    try {
      var savedDB = localStorage.getItem('db_39_local');
      DB = (savedDB && JSON.parse(savedDB).length) ? JSON.parse(savedDB) : SAMPLE_DB;
    } catch(e) { DB = SAMPLE_DB; }
    loadDateOverrides(); loadBlockedSlots(); loadResvData();
    hide('loadingScreen');
    showPage('landing');
  }
};

// 학생 1명 저장 (핵심 — 충돌 없는 upsert)
async function saveOneNow(num) {
  var s = DB.find(function(x){ return x.student_num === num; });
  if (!s) { toast('❌ 저장 대상을 찾을 수 없어요'); return; }
  _isSaving = true;
  var ind = el('savingIndicator');
  ind.textContent = '☁️ 저장 중…'; ind.classList.add('show');
  try {
    if (isSupabase()) {
      await sbSaveOne(s);
    } else if (typeof google !== 'undefined' && google.script) {
      await new Promise(function(resolve, reject) {
        google.script.run
          .withSuccessHandler(resolve)
          .withFailureHandler(reject)
          .saveOne(s);
      });
    } else {
      localStorage.setItem('db_39_local', JSON.stringify(DB));
    }
    _isSaving = false;
    ind.classList.remove('show');
    toast('☁️ 저장됨');
  } catch(e) {
    _isSaving = false;
    ind.classList.remove('show');
    console.error('saveOneNow error', e);
    toast('❌ 저장 실패 — 다시 시도해주세요');
  }
}

// 전체 저장 (학생 추가·삭제·엑셀 업로드 전용)
async function saveAllNow() {
  _isSaving = true;
  var ind = el('savingIndicator');
  ind.textContent = '☁️ 저장 중…'; ind.classList.add('show');
  try {
    if (isSupabase()) {
      // Supabase는 upsert 방식으로 전체 업데이트
      for (var i = 0; i < DB.length; i++) {
        await sbSaveOne(DB[i]);
      }
    } else if (typeof google !== 'undefined' && google.script) {
      await new Promise(function(resolve, reject) {
        google.script.run.withSuccessHandler(resolve).withFailureHandler(reject).save(DB);
      });
    } else {
      localStorage.setItem('db_39_local', JSON.stringify(DB));
    }
    _isSaving = false;
    ind.classList.remove('show');
    toast('☁️ 저장됨');
  } catch(e) {
    _isSaving = false;
    ind.classList.remove('show');
    toast('❌ 저장 실패');
  }
}

// 하위 호환
function scheduleSave(num) {
  clearTimeout(_saveTimer);
  _saveTimer = setTimeout(function(){
    var target = num || currentNum || (stuSession && stuSession.student_num);
    if (target) saveOneNow(target);
    else saveAllNow();
  }, 300);
}

    +'<button class="btn btn-primary" style="width:100%" id="btnDoImport">📤 업로드</button>'
    +'<div id="importResult" style="margin-top:10px;font-size:13px"></div>');

function importExcel(){
  var file=el('xlsxFile').files[0]; if(!file){toast('❌ 파일 선택');return;}
  var resultEl=el('importResult'); resultEl.innerHTML='⏳ 처리 중…';
  if(file.name.endsWith('.csv')){
    var reader=new FileReader();
    reader.onload=function(e){
      var lines=e.target.result.split('\n').filter(function(l){return l.trim();});
      var added=0,skipped=0;
      lines.slice(1).forEach(function(line){
        var cols=line.split(',').map(function(c){return c.replace(/^"|"$/g,'').trim();});
        if(!cols[0]||!cols[1])return;
        if(DB.find(function(x){return x.student_num===cols[0];})){skipped++;return;}
        DB.push(makeStudent(cols[0],cols[1],cols[2]||'',cols[3]||'',cols[4]||'',cols[5]||''));
        added++;
      });
      saveAllNow(); renderSidebar();
      resultEl.innerHTML='<span style="color:#059669;font-weight:700">✅ '+added+'명 추가</span>'+(skipped?' / '+skipped+'명 중복 건너뜀':'');
    };
    reader.readAsText(file,'utf-8'); return;
  }
  if(typeof XLSX==='undefined'){
    var sc=document.createElement('script');
    sc.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    sc.onload=function(){doImportXlsx(file,resultEl);};
    sc.onerror=function(){resultEl.innerHTML='<span style="color:#dc2626">❌ 라이브러리 로드 실패. CSV로 변환 후 시도하세요.</span>';};
    document.head.appendChild(sc);
  } else { doImportXlsx(file,resultEl); }
}
function doImportXlsx(file,resultEl){
  var reader=new FileReader();
  reader.onload=function(e){
    try{
      var wb=XLSX.read(e.target.result,{type:'array'});
      var rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''});
      var added=0,skipped=0;
      rows.slice(1).forEach(function(cols){
        var num=String(cols[0]||'').trim(),name=String(cols[1]||'').trim();
        if(!num||!name)return;
        if(DB.find(function(x){return x.student_num===num;})){skipped++;return;}
        DB.push(makeStudent(num,name,String(cols[2]||'').trim(),String(cols[3]||'').trim(),String(cols[4]||'').trim(),String(cols[5]||'').trim()));
        added++;
      });
      saveAllNow(); renderSidebar(); closeModal(); toast('✅ '+added+'명 추가'+(skipped?' ('+skipped+'명 중복)':''));
      showOverview();
    }catch(err){resultEl.innerHTML='<span style="color:#dc2626">❌ 파일 읽기 실패</span>';}
  };
  reader.readAsArrayBuffer(file);
}
function makeStudent(num,name,gender,phone,mom,dad){
  return{student_num:num,name:name,gender:gender,phone:phone,mom_phone:mom,dad_phone:dad,career_hope:'',hope_dept:'',special1:'',remark:'',counseling_notes:'',counseling_records:[],hope_schools:[],reserve_schools:[],pin:String(Math.floor(1000+Math.random()*9000)),analysis:{attendance:'',behavior:'',autonomous:'',club:'',volunteer:'',career_activity:'',subject_special:'',overall_eval:'',academic:'',career:'',community:''}};
}

// ── 신호등 ──────────────────────────────────────
function getTrafficLight(h){
  var u=parseFloat(h.uni_score),t=parseFloat(h.stu_score);
  if(isNaN(u)||isNaN(t))return{cls:'gray',icon:'⚪',label:'정보없음',text:'tl-gray'};
  var diff=t-u;
  if(diff<=-0.3)return{cls:'green',icon:'🟢',label:'유리',text:'tl-green'};
  if(diff<=0.3)return{cls:'yellow',icon:'🟡',label:'비슷',text:'tl-yellow'};
  return{cls:'red',icon:'🔴',label:'불리',text:'tl-red'};
}

function showCalendar(){

  currentNum=null; setNavActive('navCal'); el('topbarTitle').textContent='📅 입시 일정'; el('topbarActions').innerHTML='';
  var today=new Date(); today.setHours(0,0,0,0);
  var events=[];
  DB.forEach(function(s){
    (s.hope_schools||[]).forEach(function(h){
      if(!h.school)return;
      [['first_date','1차발표'],['interview_date','면접'],['final_date','발표']].forEach(function(t){
        if(h[t[0]]) events.push({date:h[t[0]],type:t[1],school:h.school,dept:h.dept||'',student:s.name,num:s.student_num});
      });
    });
  });
  events.sort(function(a,b){return a.date.localeCompare(b.date);});
  if(!events.length){el('teacherContent').innerHTML='<div class="card card-body" style="text-align:center;color:#d1d5db;padding:40px">📅 등록된 일정이 없습니다.<br><br>각 학생 희망대학 편집에서 날짜를 입력하세요.</div>';return;}
  var upcoming=events.filter(function(e){return new Date(e.date)>=today;});
  var past=events.filter(function(e){return new Date(e.date)<today;}).reverse();
  var dayNames=['일','월','화','수','목','금','토'];
  function renderEvt(evts,isPast){
    return evts.map(function(e){
      var d=new Date(e.date);
      var dday=Math.round((d-today)/(1000*60*60*24));
      var ddayH=dday===0?'<span class="dday-badge dday-today">D-DAY</span>':dday<0?'<span class="dday-badge dday-past">'+Math.abs(dday)+'일 전</span>':'<span class="dday-badge dday-soon">D-'+dday+'</span>';
      return'<div class="tl-item'+(isPast?' tl-past':'')+'"><div class="tl-dot type-'+e.type+'"></div><div class="tl-card type-'+e.type+'"><div class="tl-card-hd"><span class="tl-type-badge type-'+e.type+'-bg">'+e.type+'</span><span class="tl-school">'+e.school+'</span><span style="font-size:11px;color:#6b7280">'+e.dept+'</span><span style="margin-left:auto;font-size:11px;color:#6b7280">'+e.student+'</span></div><div style="display:flex;align-items:center;gap:10px"><span style="font-size:12px;color:#4f46e5;font-weight:600">📅 '+e.date+' ('+dayNames[d.getDay()]+')</span>'+ddayH+'</div></div></div>';
    }).join('');
  }

    +'<div><div style="font-size:12px;font-weight:700;color:#374151;margin-bottom:10px">다가오는 일정 '+upcoming.length+'개</div><div class="timeline-wrap">'+(upcoming.length?renderEvt(upcoming,false):'<div style="color:#d1d5db;padding:20px;text-align:center">없음</div>')+'</div></div>'
    +'<div><div style="font-size:12px;font-weight:700;color:#9ca3af;margin-bottom:10px">지나간 일정 '+past.length+'개</div><div class="timeline-wrap">'+(past.length?renderEvt(past,true):'<div style="color:#d1d5db;padding:20px;text-align:center">없음</div>')+'</div></div>'
    +'</div>';
}
