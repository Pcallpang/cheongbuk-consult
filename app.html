async function confirmQuickInput(num){ var valid=_parsedRows.filter(function(r){return r.school.trim();}); if(!valid.length){toast('❌ 인식된 대학 없음');return;} var s=DB.find(function(x){return x.student_num===num;}); if(!s.hope_schools)s.hope_schools=[]; valid.forEach(function(r){s.hope_schools.push(r);}); await saveOneNow(num); closeModal(); toast('✅ '+valid.length+'개 추가됨'); showStudent(num); }
function parseSchoolLine(raw){
  var line=raw.trim(); if(!line)return null;
  var r={school:'',dept:'',direction:'',admission_type:'',sub_type:'',interview:'',uni_score:'',stu_score:'',capacity:'',csat_min:'',note:'',first_date:'',interview_date:'',final_date:''};
  var dirM=line.match(/상향|소신|적정|하향/); if(dirM)r.direction=dirM[0];
  if(/학생부종합|학종/.test(line))r.admission_type='학생부종합';
  else if(/학생부교과/.test(line))r.admission_type='학생부교과';
  else if(/논술/.test(line))r.admission_type='논술 위주';
  else if(/종합/.test(line))r.admission_type='학생부종합';
  else if(/교과/.test(line))r.admission_type='학생부교과';
  var subKws=[['기회균형','기회균형'],['고른기회','고른기회'],['농어촌','농어촌'],['지역균형','지역균형'],['지균','지역균형'],['자기추천','자기추천'],['교과우수','교과우수'],['일반학생','일반학생'],['일반','일반']];
  for(var i=0;i<subKws.length;i++){if(line.indexOf(subKws[i][0])>=0){r.sub_type=subKws[i][1];break;}}
  if(/면접\s*있/i.test(line))r.interview='있음';
  else if(/면접\s*없/i.test(line)||/비면접/.test(line))r.interview='없음';
  var csatM=line.match(/없음|\d+합\s*\d+/); if(csatM)r.csat_min=csatM[0].replace(/\s/g,'');
  var capM=line.match(/(\d+)\s*명/); if(capM)r.capacity=capM[1]+'명';
  var scoreRx=/\d+\.\d+/g,scores=[],sm; while((sm=scoreRx.exec(line))!==null)scores.push(sm[0]);
  if(scores.length>=2){r.uni_score=scores[0];r.stu_score=scores[1];}else if(scores.length===1){r.uni_score=scores[0];}
  var deptM=line.match(/[가-힣a-zA-Z]{1,20}(?:학과|학부|전공|계열)/); if(deptM)r.dept=deptM[0];
  var uniM=line.match(/[가-힣a-zA-Z]+(?:대학교|대학|대)(?:에리카|미래캠|천안|아산|글로컬|상록|성심)?/); if(uniM)r.school=uniM[0];
  return r;
}

async function loadResvData() {
  try {
    if (isSupabase()) {
      var data = await sbLoadResv();
      RESERVATIONS = data.resvs || [];
      NOTIFICATIONS = data.notifs || [];
      if (data.dateOverrides) DATE_SLOT_OVERRIDES = data.dateOverrides;
      if (data.blockedSlots)  BLOCKED_SLOTS = data.blockedSlots;
      if (data.consultSlots)  { CONSULT_SLOTS = data.consultSlots; buildSlotLabels(); }
    } else if (typeof google !== 'undefined' && google.script) {
      google.script.run
        .withSuccessHandler(function(data){
          if(!data) return;
          RESERVATIONS = data.resvs || [];
          NOTIFICATIONS = data.notifs || [];
          if(data.dateOverrides) DATE_SLOT_OVERRIDES = data.dateOverrides;
          if(data.blockedSlots)  BLOCKED_SLOTS = data.blockedSlots;
          updateNotifBadge();
          autoRefreshView();
        })
        .withFailureHandler(function(){})
        .loadResv();
      return; // GAS는 콜백 방식이라 여기서 리턴
    } else {
      try {
        var rd = localStorage.getItem('resv_39_2026');
        if(rd) RESERVATIONS = JSON.parse(rd);
        var od = localStorage.getItem('dateOverrides_39');
        if(od) DATE_SLOT_OVERRIDES = JSON.parse(od);
        var bd = localStorage.getItem('blockedSlots_date_39');
        if(bd) BLOCKED_SLOTS = JSON.parse(bd);
      } catch(e) {}
    }
    updateNotifBadge();
    autoRefreshView();
  } catch(e) {
    console.error('loadResvData error', e);
  }
}

function autoRefreshView() {

  if(role === 'student' && stuTab === 'resv') renderStuResvCalendar();

function startPolling() {
  stopPolling();
  if (isSupabase()) {
    // Supabase Realtime이 있으면 폴링 불필요 — 즉시 반영
    startRealtime();
  } else {
    _pollTimer = setInterval(function(){ loadResvData(); }, 10000);
  }
}
function stopPolling() {
  if(_pollTimer) { clearInterval(_pollTimer); _pollTimer = null; }
  stopRealtime();
}
async function saveResvData() {
  try {
    if (isSupabase()) {
      await sbSaveResv(RESERVATIONS, NOTIFICATIONS, DATE_SLOT_OVERRIDES, BLOCKED_SLOTS);
    } else if (typeof google !== 'undefined' && google.script) {
      google.script.run
        .withSuccessHandler(function(){ loadResvData(); })
        .withFailureHandler(function(){})
        .saveResv(RESERVATIONS, NOTIFICATIONS, DATE_SLOT_OVERRIDES, BLOCKED_SLOTS);
      return;
    } else {
      try {
        localStorage.setItem('resv_39_2026', JSON.stringify(RESERVATIONS));
        localStorage.setItem('dateOverrides_39', JSON.stringify(DATE_SLOT_OVERRIDES));
        localStorage.setItem('blockedSlots_date_39', JSON.stringify(BLOCKED_SLOTS));

// 10분 단위 시간 select 옵션 생성
function timeOptions(selected) {
  var opts = '';
  for(var h=8; h<=21; h++) {
    for(var m=0; m<60; m+=10) {
      if(h===21 && m>0) break; // 21:00까지만
      var hh = (h<10?'0':'')+h;
      var mm = (m===0?'00':String(m));
      var val = hh+':'+mm;
      var ampm = h<12 ? '오전 '+h : h===12 ? '오후 12' : '오후 '+(h-12);
      var label = ampm+'시 '+mm+'분';
      opts += '<option value="'+val+'"'+(val===selected?' selected':'')+'>'+label+'</option>';
    }
  }
  // 선택값이 범위 밖이면 첫 옵션 선택되도록 처리
  return opts;
}
function buildSlotLabels() {

function renderCalGrid(year, month, gridId, isTeacher) {
  var grid = el(gridId);
  var dows=['일','월','화','수','목','금','토'];
  var today = new Date(); today.setHours(0,0,0,0);
  grid.innerHTML = dows.map(function(d){ return '<div class="cal-dow">'+d+'</div>'; }).join('');
  var firstDay = new Date(year, month, 1).getDay();
  var lastDate = new Date(year, month+1, 0).getDate();
  var prevLast = new Date(year, month, 0).getDate();
  // 이전달 빈칸
  for(var i=0;i<firstDay;i++){
    var d = prevLast - firstDay + 1 + i;
    grid.innerHTML += '<div class="cal-day other-month"><div class="cal-day-num">'+d+'</div></div>';
  }
  for(var d=1;d<=lastDate;d++){
    var dateObj = new Date(year, month, d);
    var dateStr = year+'-'+pad(month+1)+'-'+pad(d);
    var dow = dateObj.getDay();
    var isPast = dateObj < today;
    var isWeekend = dow===0||dow===6;
    var holiday = HOLIDAYS[dateStr];
    var cls = 'cal-day';
    if(dateObj.getTime()===today.getTime()) cls+=' today';
    if(isPast) cls+=' past';
    if(holiday||isWeekend) cls+=' holiday';
    // 슬롯 상태

    var isNoConsult = isWeekend || holiday;
    var dayHtml = '<div class="'+cls+'" data-date="'+dateStr+'">'
      +'<div class="cal-day-num'+(dow===0?' sun':dow===6?' sat':'')+'">'+d+(holiday?'<div style="font-size:9px;color:#ef4444">'+holiday+'</div>':'')+'</div>';
    if(isNoConsult){
      dayHtml += '<div class="no-consult-label">상담 없음</div>';
    } else if(!isPast) {
      var daySlots = getSlotsForDate(dateStr);
      daySlots.forEach(function(slot){
        var status = getSlotStatus(dateStr, slot.id, isTeacher);
        dayHtml += renderSlotBtn(dateStr, slot.id, status, isTeacher);
      });
      // 날짜 오버라이드가 있으면 표시
      if(DATE_SLOT_OVERRIDES[dateStr] && isTeacher) {
        dayHtml += '<div style="font-size:9px;color:var(--c-primary-500);font-weight:700;margin-top:3px">✏️ 개별설정</div>';
      }
    }
    dayHtml += '</div>';
    grid.innerHTML += dayHtml;
  }
  // 다음달 빈칸
  var total = firstDay + lastDate;
  var remaining = total%7===0?0:7-(total%7);
  for(var i=1;i<=remaining;i++){
    grid.innerHTML += '<div class="cal-day other-month"><div class="cal-day-num">'+i+'</div></div>';
  }
  // 슬롯 버튼 이벤트
  grid.querySelectorAll('[data-slot]').forEach(function(btn){
    btn.addEventListener('click', function(){
      var date=this.dataset.date, slot=parseInt(this.dataset.slot);
      if(isTeacher) showTeacherSlotModal(date, slot);
      else showStudentBookModal(date, slot);
    });
  });
}


function renderSlotBtn(dateStr, slot, status, isTeacher) {
  var daySlots = getSlotsForDate(dateStr);
  var slotObj = daySlots.find(function(s){return s.id===slot;}) || CONSULT_SLOTS.find(function(s){return s.id===slot;}) || {label:slot+'타임',startTime:'',endTime:''};
  var slotShort = slotObj.label;
  var timeLabel = slotObj.startTime+(slotObj.endTime?'-'+slotObj.endTime:'');
  // 학생용: 본인 예약이면 mine
  if(!isTeacher && stuSession) {
    var resv = getSlotResv(dateStr, slot);
    if(resv && resv.studentNum===stuSession.student_num) {
      var sLabel = resv.status==='confirmed'?'확정':'대기중';
      return '<button class="slot-btn slot-mine" data-slot="'+slot+'" data-date="'+dateStr+'">'+slotShort+' '+sLabel+'</button>';
    }
    if(status!=='available') return '<button class="slot-btn slot-full" disabled>'+slotShort+' 마감</button>';
    return '<button class="slot-btn slot-available" data-slot="'+slot+'" data-date="'+dateStr+'">'+slotShort+' '+timeLabel+'</button>';
  }
  // 교사용
  var clsMap={available:'slot-available',pending:'slot-pending',confirmed:'slot-confirmed',teacher:'slot-confirmed',full:'slot-full'};
  var lblMap={available:slotShort+' '+timeLabel,pending:slotShort+' 신청대기',confirmed:slotShort+' 확정',teacher:slotShort+' 확정',full:slotShort+' 마감🚫'};
  // 교사는 마감 슬롯도 클릭 가능 (해제를 위해)
  var disabled = (!isTeacher && status==='full') ? ' disabled' : '';
  return '<button class="slot-btn '+clsMap[status]+'"'+disabled+' data-slot="'+slot+'" data-date="'+dateStr+'">'+lblMap[status]+'</button>';
}

function teacherBook(dateStr, slot) {

  RESERVATIONS.push(resv);

  addNotif('📅 '+dateStr+' '+slot+'타임 상담이 확정되었습니다.', stuNum, 'resv');

function confirmResv(id) {
  var resv = RESERVATIONS.find(function(r){ return r.id===id; });
  if(!resv) return;
  resv.status = 'confirmed';
  saveResvData();
  addNotif('✅ '+resv.date+' '+resv.slot+'타임 상담이 확정되었습니다!', resv.studentNum, 'resv');
  toast('✅ 예약 확정됨');
  closeModal();
  renderResvCalendar();
}

function cancelResv(id) {
  var resv = RESERVATIONS.find(function(r){ return r.id===id; });
  if(!resv) return;
  var stuNum = resv.studentNum;
  var date = resv.date, slot = resv.slot;
  RESERVATIONS = RESERVATIONS.filter(function(r){ return r.id!==id; });
  saveResvData();
  addNotif('❌ '+date+' '+slot+'타임 상담 예약이 취소되었습니다.', stuNum, 'resv');
  toast('✅ 취소됨');
  closeModal();
  renderResvCalendar();
}

// ── 슬롯 마감 처리
function closeSlot(dateStr, slotId, resvId) {
  // 기존 예약이 있으면 먼저 취소 알림 발송
  if(resvId) {
    var resv = RESERVATIONS.find(function(r){ return r.id===resvId; });
    if(resv) {
      RESERVATIONS = RESERVATIONS.filter(function(r){ return r.id!==resvId; });
      addNotif('🚫 '+dateStr+' '+slotId+'타임 상담 예약이 마감 처리되었습니다.', resv.studentNum, 'resv');
    }
  }
  // BLOCKED_SLOTS에 등록
  if(!BLOCKED_SLOTS[dateStr]) BLOCKED_SLOTS[dateStr] = [];
  if(BLOCKED_SLOTS[dateStr].indexOf(slotId) === -1) BLOCKED_SLOTS[dateStr].push(slotId);
  saveBlockedSlots();
  toast('🚫 해당 타임이 마감 처리됐어요');
  closeModal();
  renderResvCalendar();
}

    +'<div class="form-group"><label class="form-label">타임 이름</label><input type="text" id="newSlotLabel" placeholder="예: 3타임" value="'+(getSlotsForDate(dateStr).length+1)+'타임"></div>'
    +'<div class="form-group"><label class="form-label">시작 시간</label><select id="newSlotStart">'+timeOptions('14:00')+'</select></div>'
    +'<div class="form-group"><label class="form-label">종료 시간</label><select id="newSlotEnd">'+timeOptions('15:00')+'</select></div>'
    +'<button class="btn btn-primary" style="width:100%;margin-top:4px" id="btnConfirmAddDateSlot">➕ 타임 추가</button>';
  openModalSm(dateStr+' 타임 추가', html);
  on('btnConfirmAddDateSlot','click',function(){
    var lbl = el('newSlotLabel').value.trim();
    var st  = el('newSlotStart').value;
    var en  = el('newSlotEnd').value;
    if(!lbl){ toast('❌ 타임 이름을 입력해주세요'); return; }
    if(st >= en){ toast('❌ 종료 시간은 시작 시간보다 늦어야 해요'); return; }
    var baseSlots = JSON.parse(JSON.stringify(DATE_SLOT_OVERRIDES[dateStr] || CONSULT_SLOTS));
    var newSlot = {id: newId, label: lbl, startTime: st, endTime: en};
    baseSlots.push(newSlot);
    DATE_SLOT_OVERRIDES[dateStr] = baseSlots;
    saveDateOverrides();
    toast('✅ '+dateStr+'에 '+lbl+' 타임이 추가됐어요');
    closeModal();
    renderResvCalendar();
  });
}

// ── 학생 예약 모달
function showStudentBookModal(dateStr, slot) {
  var resv = getSlotResv(dateStr, slot);
  var slotLabel = SLOT_LABELS[slot];
  if(resv && resv.studentNum===stuSession.student_num) {
    // 내 예약 - 취소 가능
    var html='<div style="margin-bottom:12px"><b>'+dateStr+'</b> &nbsp;'+slotLabel+'</div>'
      +'<div class="resv-item"><div><div class="resv-name">내 예약</div><div class="resv-slot">'+slotLabel+'</div>'
      +'<div style="margin-top:4px"><span class="resv-status '+(resv.status==='pending'?'status-pending':'status-confirmed')+'">'+getStatusLabel(resv.status)+'</span></div></div></div>'
      +'<button class="btn btn-danger" style="width:100%;margin-top:12px" id="btnStuCancelResv">❌ 예약 취소</button>';
    openModalSm('내 상담 예약', html);
    on('btnStuCancelResv','click',function(){ cancelResv(resv.id); closeModal(); renderStuResvCalendar(); });
    return;
  }
  if(resv) { toast('❌ 이미 예약된 시간입니다'); return; }
  var s = DB.find(function(x){ return x.student_num===stuSession.student_num; });
  var html='<div style="margin-bottom:12px"><b>'+dateStr+'</b> &nbsp;'+slotLabel+'</div>'
    +'<div style="background:#f0f7ff;border:1px solid #dbeafe;border-radius:8px;padding:10px;margin-bottom:12px;font-size:13px">'
    +'🎓 <b>'+s.name+'</b> 학생의 상담을 예약합니다.</div>'
    +'<div class="form-group"><label class="form-label">상담 내용 (선택)</label><input type="text" id="stuBookMemo" placeholder="상담하고 싶은 내용을 간략히 입력하세요"></div>'
    +'<button class="btn btn-primary" style="width:100%" id="btnStuDoBook">📅 예약 신청</button>';
  openModalSm('상담 예약 신청', html);
  on('btnStuDoBook','click',function(){ studentBook(dateStr, slot); });
}

function studentBook(dateStr, slot) {
  var s = DB.find(function(x){ return x.student_num===stuSession.student_num; });
  var memo = el('stuBookMemo').value.trim();
  // 이미 같은 날 예약했는지 확인
  var existing = RESERVATIONS.find(function(r){ return r.studentNum===stuSession.student_num && r.date===dateStr; });
  if(existing){ toast('❌ 같은 날 이미 예약이 있습니다'); return; }
  var resv = {id:Date.now(), date:dateStr, slot:slot, studentNum:stuSession.student_num, studentName:s.name, status:'pending', memo:memo, createdAt:new Date().toISOString()};
  RESERVATIONS.push(resv);
  saveResvData();
  addNotif('📬 '+s.name+' 학생이 '+dateStr+' '+slot+'타임 상담을 신청했습니다.', 'teacher', 'resv');
  toast('✅ 예약 신청 완료! 선생님 확정 후 알림이 옵니다.');
  closeModal();
  renderStuResvCalendar();
}

// ── 학생용 예약 캘린더
function showStuResv() {
  var now = new Date();
  resvCalYear = now.getFullYear();
  resvCalMonth = now.getMonth();
  renderStuResvCalendar();
}

function renderStuResvCalendar() {
  var s = DB.find(function(x){ return x.student_num===stuSession.student_num; });
  var scEl = el('studentContent');
  if(!scEl) return;
  var content = scEl;
  var monthNames=['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
  var myResvs = RESERVATIONS.filter(function(r){ return r.studentNum===stuSession.student_num; });
  var tbar = renderStuTabBar();
  var myResvHtml = '';
  if(myResvs.length) {
    myResvHtml = '<div class="card card-body" style="margin-bottom:14px"><div class="sec-title">📋 내 예약 현황</div>'
      +myResvs.sort(function(a,b){return a.date.localeCompare(b.date);}).map(function(r){
        return'<div class="resv-item"><div class="resv-date">'+r.date+'</div>'
          +'<div class="resv-slot">'+SLOT_LABELS[r.slot]+'</div>'
          +'<span class="resv-status '+(r.status==='pending'?'status-pending':'status-confirmed')+'">'+getStatusLabel(r.status)+'</span>'
          +(r.memo?'<div style="font-size:11px;color:#6b7280">'+r.memo+'</div>':'')
          +'</div>';
      }).join('')
      +'</div>';
  }
  content.innerHTML = tbar + myResvHtml
    +'<div class="cal-wrap">'
    +'<div class="cal-header"><h3>'+resvCalYear+'년 '+monthNames[resvCalMonth]+'</h3><div style="display:flex;align-items:center;gap:6px"><button class="btn btn-secondary btn-sm" id="btnStuResvRefresh" title="새로고침">🔄</button><div class="cal-nav"><button id="btnStuCalPrev">‹</button><button id="btnStuCalNext">›</button></div></div></div>'
    +'<div class="cal-grid" id="stuCalGrid"></div></div>'
    +'<div style="margin-top:10px;font-size:11px;color:#9ca3af;text-align:center">💡 예약 가능한 날짜를 클릭해서 상담을 신청하세요</div>';
  content.querySelectorAll('[data-stutab]').forEach(function(btn){ btn.addEventListener('click',function(){ stuTab=this.dataset.stutab; renderStudentApp(); }); });
  on('btnStuRefresh','click',function(){ loadResvData(); renderStudentApp(); toast('🔄 새로고침됨'); });
  on('btnStuResvRefresh','click',function(){ loadResvData(); renderStuResvCalendar(); toast('🔄 새로고침됨'); });
  on('btnStuCalPrev','click',function(){ resvCalMonth--; if(resvCalMonth<0){resvCalMonth=11;resvCalYear--;} renderStuResvCalendar(); });
  on('btnStuCalNext','click',function(){ resvCalMonth++; if(resvCalMonth>11){resvCalMonth=0;resvCalYear++;} renderStuResvCalendar(); });
  renderCalGrid(resvCalYear, resvCalMonth, 'stuCalGrid', false);
}

function renderStuTabBar() {
  var tabs=[['schools','🏫 희망대학'],['stu_report','📊 분석'],['analysis','생기부'],['counsel','상담기록'],['resv','📅 상담예약'],['edit','내 정보 수정']];
  var html='<div style="display:flex;align-items:center;gap:6px;margin-bottom:16px"><div style="display:flex;background:#f3f4f6;border-radius:9px;padding:3px;overflow-x:auto;flex:1">';
  tabs.forEach(function(t){ html+='<button class="tab-btn'+(stuTab===t[0]?' active':'')+'" data-stutab="'+t[0]+'">'+t[1]+'</button>'; });
  // 희망대학 탭일 때만 새로고침 버튼 표시
  if(stuTab==='schools') {
    html+='</div><button class="btn btn-secondary btn-sm" id="btnStuRefresh" title="새로고침">🔄</button></div>';
  } else {
    html+='</div></div>';
  }
  return html;
}

// ── 전체 예약 목록 (교사용)
function showAllResvList() {
  var sorted = RESERVATIONS.slice().sort(function(a,b){ return a.date.localeCompare(b.date)||a.slot-b.slot; });
  var html = '<div style="margin-bottom:12px;display:flex;gap:8px">'
    +'<button class="btn btn-secondary btn-sm" id="btnFilterAll" style="'+(true?'border-color:#4f46e5;color:#4f46e5':'')+'">전체</button>'
    +'<button class="btn btn-secondary btn-sm" id="btnFilterPending">신청대기</button>'
    +'<button class="btn btn-secondary btn-sm" id="btnFilterConfirmed">확정</button>'
    +'</div>';
  if(!sorted.length){ html+='<div style="text-align:center;color:#d1d5db;padding:30px">예약이 없습니다</div>'; }
  else {
    html += sorted.map(function(r){
      var s = DB.find(function(x){ return x.student_num===r.studentNum; });
      return'<div class="resv-item">'
        +'<div class="resv-date">'+r.date+'<div class="resv-slot">'+SLOT_LABELS[r.slot]+'</div></div>'
        +'<div class="resv-name">'+(s?s.name:r.studentNum)+'</div>'
        +(r.memo?'<div style="font-size:12px;color:#6b7280;flex:1">'+r.memo+'</div>':'<div style="flex:1"></div>')
        +'<span class="resv-status '+(r.status==='pending'?'status-pending':'status-confirmed')+'">'+getStatusLabel(r.status)+'</span>'
        +(r.status==='pending'?'<button class="btn btn-primary btn-sm" data-confirmid="'+r.id+'">확정</button>':'')
        +'<button class="btn btn-danger btn-sm" data-cancelid="'+r.id+'">취소</button>'
        +'</div>';
    }).join('');
  }
  openModal('📋 전체 예약 목록', html);
  el('modalBox').querySelectorAll('[data-confirmid]').forEach(function(btn){
    btn.addEventListener('click',function(){ confirmResv(parseInt(this.dataset.confirmid)); closeModal(); showAllResvList(); });
  });
  el('modalBox').querySelectorAll('[data-cancelid]').forEach(function(btn){
    btn.addEventListener('click',function(){ cancelResv(parseInt(this.dataset.cancelid)); closeModal(); if(navMode==='resv') renderResvCalendar(); });
  });
}
</script>
